<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Account — Digital Pulse Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="brand-dot"></span>
        <div class="brand-text">
          <h1>DIGITAL PULSE</h1>
          <p>Membership Manager</p>
        </div>
      </div>

      <h2 class="auth-title" data-i18n="createAccount">Create your account</h2>
      <p class="auth-sub" data-i18n="signupSub">Set up your organization in minutes</p>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" data-i18n="fullName">Full Name</label>
          <input type="text" class="form-input" id="signup-name" placeholder="John Smith" required>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="email">Email</label>
          <input type="email" class="form-input" id="signup-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="password">Password</label>
          <input type="password" class="form-input" id="signup-password" placeholder="Min 6 characters" minlength="6" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="orgName">Organization Name</label>
          <input type="text" class="form-input" id="signup-org" placeholder="FitZone Gym" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;" data-i18n="signup">Create Account</button>
      </form>

      <p class="auth-footer">
        <span data-i18n="haveAccount">Already have an account?</span>
        <a href="/auth/login.html" data-i18n="login">Login</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth } from '/src/js/auth.js';
    import { i18n } from '/src/js/i18n.js';
    import { showToast } from '/src/js/ui.js';
    i18n.apply();

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userData = {
        name: document.getElementById('signup-name').value,
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value,
        orgName: document.getElementById('signup-org').value
      };
      const result = await auth.signup(userData);
      if (result.success) {
        showToast(i18n.t.welcome, 'success');
        setTimeout(() => window.location.href = '/public/app.html', 500);
      } else {
        showToast(result.error || i18n.t.error, 'error');
      }
    });
  </script>
</body>
</html>
