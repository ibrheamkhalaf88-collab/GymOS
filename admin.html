<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Digital Pulse — Admin Dashboard</title>
  <meta name="description" content="Manage users, subscriptions, and coupons" />
  <meta name="theme-color" content="#000000" />
  <script src="vendor/tailwind.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { min-height: max(884px, 100dvh); }
    .cyber-grid {
      background-image:
        linear-gradient(to right, rgba(68, 73, 51, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(68, 73, 51, 0.12) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-volt { box-shadow: 0 0 60px rgba(204, 255, 0, 0.12); }

    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #333333;
    }
    .admin-table th {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c4c9ac;
      background-color: #0d0d0d;
    }
    .admin-table tr:hover td { background-color: rgba(204, 255, 0, 0.03); }
    .admin-table td { font-size: 0.9rem; color: #e2e4cf; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .badge-active { background-color: rgba(204, 255, 0, 0.15); color: #CCFF00; }
    .badge-trial { background-color: rgba(100, 100, 255, 0.15); color: #8888ff; }
    .badge-expired { background-color: rgba(255, 51, 102, 0.15); color: #ff3366; }
    .badge-none { background-color: rgba(100, 100, 100, 0.15); color: #666666; }

    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.7rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn-activate {
      background-color: rgba(204, 255, 0, 0.1);
      color: #CCFF00;
      border: 1px solid rgba(204, 255, 0, 0.3);
    }
    .btn-activate:hover { background-color: rgba(204, 255, 0, 0.2); }
    .btn-deactivate {
      background-color: rgba(255, 51, 102, 0.1);
      color: #ff3366;
      border: 1px solid rgba(255, 51, 102, 0.3);
    }
    .btn-deactivate:hover { background-color: rgba(255, 51, 102, 0.2); }

    .preset-chip {
      padding: 0.3rem 0.65rem;
      border: 1px solid #444933;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #c4c9ac;
      background-color: #171717;
      transition: all 0.15s ease;
    }
    .preset-chip:hover { color: #000; background-color: #CCFF00; border-color: #CCFF00; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-card {
      background-color: #0d0d0d;
      border: 1px solid #444933;
      border-radius: 1rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 40px rgba(204, 255, 0, 0.15);
    }
  </style>
</head>
<body class="font-body min-h-screen flex flex-col antialiased cyber-grid" style="background-color: rgb(0, 0, 0); color: #e2e4cf;">

  <!-- Top header -->
  <header class="flex justify-between items-center h-16 w-full z-50 border-b border-[#444933]" style="background-color:#000;">
    <div class="flex items-center gap-3">
      <span class="font-headline text-sm tracking-widest uppercase" style="color:#C3F400;">Admin Dashboard</span>
      <span class="arabic-text text-xs opacity-60" dir="rtl">لوحة المدير</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="hidden sm:inline text-xs opacity-60" style="color:#c4c9ac;">Online / مباشر — أونلاين</span>
      <span id="modeBadge" class="text-[10px] font-headline tracking-widest uppercase px-2 py-1 rounded border" style="color:#8888ff;border-color:#8888ff55;">DEMO</span>
      <span id="adminEmailDisplay" class="text-sm opacity-70"></span>
      <button id="adminLogoutBtn" class="text-xs text-[#ff3366] hover:underline">Logout / خروج</button>
    </div>
  </header>

  <!-- Stats bar -->
  <div class="flex flex-wrap items-center gap-4 p-4 border-b border-[#444933]" style="background-color:#0a0a0a;">
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Total Users:</span>
      <span id="statTotal" class="font-headline text-lg" style="color:#CCFF00;">0</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Active:</span>
      <span id="statActive" class="font-headline text-lg" style="color:#CCFF00;">0</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Trial:</span>
      <span id="statTrial" class="font-headline text-lg" style="color:#8888ff;">0</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Expired:</span>
      <span id="statExpired" class="font-headline text-lg" style="color:#ff3366;">0</span>
    </div>

    <div class="ml-auto flex gap-2">
      <button id="refreshBtn" class="btn-sm bg-[#333333] text-[#e2e4cf] hover:bg-[#444444]">
        Refresh / تحديث
      </button>
      <button id="addCouponBtn" class="btn-sm bg-[#CCFF00] text-black hover:bg-[#B8E600]">
        + Add Coupon
      </button>
    </div>
  </div>

  <!-- Search & filter -->
  <div class="flex flex-wrap items-center gap-4 p-4 border-b border-[#444933]" style="background-color:#0d0d0d;">
    <div class="flex items-center gap-2 flex-1 min-w-[200px]">
      <input id="searchInput" type="text" placeholder="Search by email or name..."
        class="auth-input flex-1" style="background-color:#171717;" />
    </div>
    <select id="statusFilter" class="auth-input w-auto" style="background-color:#171717; cursor:pointer;">
      <option value="all">All / الكل</option>
      <option value="active">Active / نشط</option>
      <option value="trial">Trial / تجربة</option>
      <option value="trial_expired">Pending Activation / بانتظار التفعيل</option>
      <option value="expired">Expired / منتهي</option>
      <option value="suspended">Suspended / موقوف</option>
    </select>
  </div>

  <!-- Users table -->
  <div class="flex-1 overflow-auto">
    <table class="admin-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Subscription</th>
          <th>Expires</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="6" class="text-center py-8 text-sm opacity-60">Loading users...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <footer class="flex justify-center items-center py-4 border-t border-[#444933]" style="background-color:#000;">
    <p class="text-xs opacity-60" style="color:#c4c9ac;">© 2026 Digital Pulse — All rights reserved</p>
  </footer>

  <!-- Create / Edit User Modal -->
  <div id="userModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="userModalTitle" class="font-headline text-xl mb-4 flex items-center gap-2" style="color:#CCFF00;">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span id="userModalTitleText">Add User / إضافة مستخدم</span>
      </h3>
      <form id="userForm" class="space-y-4">
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Full Name / الاسم الكامل</label>
          <input id="userName" type="text" required class="auth-input" />
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Email / البريد</label>
          <input id="userEmail" type="email" required class="auth-input" />
        </div>
        <div id="passwordRow">
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Password / كلمة السر (8+ chars)</label>
          <input id="userPassword" type="password" required minlength="8" class="auth-input" />
        </div>

        <div class="p-3 rounded-lg border border-[#444933]" style="background-color:#171717;">
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-2" style="color:#c4c9ac;">
            Package Type / نوع الباقة
          </label>
          <select id="userSubType" class="auth-input" style="background-color:#171717; cursor:pointer;">
            <option value="trial">Free Trial (14 days) / تجربة مجانية (14 يوم)</option>
            <option value="monthly" selected>Monthly / شهر</option>
            <option value="yearly">Yearly / سنة</option>
            <option value="lifetime">Lifetime / مدى الحياة</option>
            <option value="none">No subscription / بدون اشتراك</option>
          </select>

          <label class="text-xs uppercase tracking-widest opacity-60 block mt-3 mb-1" style="color:#c4c9ac;">
            Days Open / عدد الأيام
          </label>
          <div class="flex gap-2">
            <input id="userDays" type="number" min="1" value="30" class="auth-input" style="background-color:#171717;" />
            <button type="button" class="btn-sm bg-[#333333] text-[#e2e4cf]" onclick="window._setDays(7)">+7</button>
            <button type="button" class="btn-sm bg-[#333333] text-[#e2e4cf]" onclick="window._setDays(30)">+30</button>
            <button type="button" class="btn-sm bg-[#333333] text-[#e2e4cf]" onclick="window._setDays(90)">+90</button>
            <button type="button" class="btn-sm bg-[#333333] text-[#e2e4cf]" onclick="window._setDays(180)">+180</button>
            <button type="button" class="btn-sm bg-[#333333] text-[#e2e4cf]" onclick="window._setDays(365)">+365</button>
          </div>
          <p id="subPreview" class="text-xs mt-2 font-mono" style="color:#CCFF00;"></p>
        </div>

        <div id="couponSection" class="hidden p-3 rounded-lg border border-[#444933]" style="background-color:#171717;">
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Apply Coupon Code</label>
          <div class="flex gap-2">
            <input id="couponCode" type="text" class="auth-input flex-1" placeholder="COUPON-XXXX" />
            <button id="applyCouponBtn" type="button" class="btn-sm bg-[#CCFF00] text-black">Apply</button>
          </div>
          <p id="couponResult" class="text-xs mt-1" style="color:#c4c9ac;"></p>
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <button type="button" id="cancelUserBtn" class="btn-sm bg-[#333333] text-[#e2e4cf]">Cancel / إلغاء</button>
          <button type="submit" id="submitUserBtn" class="btn-sm bg-[#CCFF00] text-black">Create User / إنشاء</button>
        </div>
      </form>
      <p id="userModalMsg" class="text-sm text-center mt-3" style="color:#ff3366;"></p>
    </div>
  </div>

  <!-- Coupon Modal -->
  <div id="couponModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="font-headline text-xl mb-4 flex items-center gap-2" style="color:#CCFF00;">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14H5V5h14m0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
        Add Coupon / إضافة كوبون
      </h3>
      <form id="couponForm" class="space-y-4">
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Coupon Code / رمز الكوبون</label>
          <input id="couponCodeInput" type="text" required class="auth-input uppercase" placeholder="COUPON-XXXX" />
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Discount Type</label>
          <select id="couponType" class="auth-input" style="background-color:#171717; cursor:pointer;">
            <option value="days_14">Free 2 weeks / 2 أسبوع مجانًا</option>
            <option value="days_30">Free 1 month / شهر مجاني</option>
            <option value="days_365">Free 1 year / سنة مجانية</option>
            <option value="percentage">Percentage discount / تخفيض نسبة</option>
          </select>
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Value (if percentage)</label>
          <input id="couponValue" type="number" min="1" max="100" value="50" class="auth-input" style="background-color:#171717;" />
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" id="cancelCouponBtn" class="btn-sm bg-[#333333] text-[#e2e4cf]">Cancel / إلغاء</button>
          <button type="submit" class="btn-sm bg-[#CCFF00] text-black">Create Coupon / إنشاء</button>
        </div>
      </form>
      <p id="couponModalMsg" class="text-sm text-center mt-3" style="color:#ff3366;"></p>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // Admin dashboard — users, subscriptions (package + days), cloud
    // Users come from the GymOS Edge Function /api/users (auth users +
    // their user_metadata subscription). Offline → local dp_demo_users.
    // ============================================================
    const $ = (sel, root = document) => root.querySelector(sel);

    const API_BASE = 'https://mwfbgucayjgbbvcyelbo.functions.supabase.co/gymos-api';
    const { appConfig } = await import('./js/config.js');
    const TIER_LABEL = {
      trial: 'Trial / تجربة', monthly: 'Monthly / شهر', yearly: 'Yearly / سنة',
      lifetime: 'Lifetime / دائم', none: 'None / بدون',
    };
    const DEFAULT_DAYS = { trial: 14, monthly: 30, yearly: 365, lifetime: 0, none: 0 };

    // Elements
    const tableBody = $('#usersTableBody');
    const searchInput = $('#searchInput');
    const statusFilter = $('#statusFilter');
    const refreshBtn = $('#refreshBtn');
    const addCouponBtn = $('#addCouponBtn');
    const statTotal = $('#statTotal');
    const statActive = $('#statActive');
    const statTrial = $('#statTrial');
    const statExpired = $('#statExpired');
    const adminEmailDisplay = $('#adminEmailDisplay');
    const adminLogoutBtn = $('#adminLogoutBtn');
    const modeBadge = $('#modeBadge');

    // User modal
    const userModal = $('#userModal');
    const userModalTitleText = $('#userModalTitleText');
    const userForm = $('#userForm');
    const userName = $('#userName');
    const userEmail = $('#userEmail');
    const userPassword = $('#userPassword');
    const passwordRow = $('#passwordRow');
    const userSubType = $('#userSubType');
    const userDays = $('#userDays');
    const subPreview = $('#subPreview');
    const submitUserBtn = $('#submitUserBtn');
    const userModalMsg = $('#userModalMsg');
    const cancelUserBtn = $('#cancelUserBtn');
    const couponSection = $('#couponSection');
    const couponCode = $('#couponCode');
    const applyCouponBtn = $('#applyCouponBtn');
    const couponResult = $('#couponResult');

    // Coupon modal
    const couponModal = $('#couponModal');
    const couponForm = $('#couponForm');
    const couponCodeInput = $('#couponCodeInput');
    const couponType = $('#couponType');
    const couponValue = $('#couponValue');
    const couponModalMsg = $('#couponModalMsg');
    const cancelCouponBtn = $('#cancelCouponBtn');

    const TOKEN = sessionStorage.getItem('dp_admin_token') || '';
    const IS_DEMO = sessionStorage.getItem('dp_demo_admin') === '1' || TOKEN.startsWith('demo-');

    let allUsers = [];
    let loading = false;
    let editId = null;

    // ---- Session guard ----
    if (!TOKEN) { window.location.href = 'admin-login.html'; }

    modeBadge.textContent = IS_DEMO ? 'OFFLINE / محلي' : 'ONLINE / أونلاين';
    modeBadge.style.color = IS_DEMO ? '#ff9800' : '#CCFF00';
    modeBadge.style.borderColor = IS_DEMO ? '#ff980055' : '#CCFF0055';
    adminEmailDisplay.textContent = IS_DEMO
      ? 'admin@gym.local'
      : (JSON.parse(localStorage.getItem('dp_current_user') || 'null') || {}).email || 'Admin';

    adminLogoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('dp_admin_token');
      sessionStorage.removeItem('dp_demo_admin');
      localStorage.removeItem('dp_current_user');
      window.location.href = 'index.html';
    });

    // ---- Helpers ----
    const ts = (v) => {
      if (v == null) return null;
      return typeof v === 'number' ? v : (Date.parse(v) || null);
    };
    function normalizeUser(u) {
      return {
        id: u.id,
        email: u.email,
        name: u.full_name || u.name || '',
        status: u.status || 'active',
        subscription: u.subTier || u.subscription || 'none',
        subStart: ts(u.subStart),
        subEnd: ts(u.subEnd),
        subTier: u.subTier || null,
        days: u.days != null ? u.days : null,
        password: u.password,
        _demo: !!u._demo,
      };
    }

    async function api(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          apikey: appConfig.supabaseAnonKey || '',
          Authorization: 'Bearer ' + TOKEN,
          ...(opts.headers || {}),
        },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    }

    // ---- Demo helpers (offline accounts via db.js) ----
    async function demoGetUsers() {
      const { demoUsersAll } = await import('./js/db.js');
      return demoUsersAll();
    }
    async function demoCreateUser(data) {
      const { demoUsersAll, demoUsersSave, findDemoUser } = await import('./js/db.js');
      if (findDemoUser(data.email)) throw new Error('Email already exists / البريد موجود مسبقاً');
      const users = demoUsersAll();
      users.push({ ...data, id: 'U' + Date.now().toString(36).toUpperCase(), createdAt: Date.now() });
      demoUsersSave(users);
      return users[users.length - 1];
    }
    async function demoUpdateUser(userId, updates) {
      const { demoUsersAll, demoUsersSave } = await import('./js/db.js');
      const users = demoUsersAll();
      const i = users.findIndex(u => u.id === userId);
      if (i === -1) throw new Error('User not found / المستخدم غير موجود');
      users[i] = { ...users[i], ...updates };
      demoUsersSave(users);
      return users[i];
    }

    async function loadUsers() {
      if (loading) return;
      loading = true;
      tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-sm opacity-60">Loading users...</td></tr>`;
      let users;
      try {
        if (IS_DEMO) throw new Error('demo');
        const data = await api('/api/users');
        users = (data || []).map(u => normalizeUser({ ...u, _demo: false }));
      } catch (err) {
        if (!IS_DEMO) console.log('Admin API unreachable — offline mode:', err.message);
        users = (await demoGetUsers()).map(u => normalizeUser({ ...u, _demo: true }));
      }
      allUsers = users;
      renderUsers(users);
      updateStats(users);
      loading = false;
    }

    // ---- Render ----
    function tierBadge(user) {
      const now = Date.now();
      const tier = user.subscription;
      const expired = user.status !== 'suspended' &&
        (tier === 'trial' || tier === 'monthly' || tier === 'yearly' || tier === 'active') &&
        user.subEnd && user.subEnd <= now;
      const suspended = user.status === 'suspended';
      if (suspended) return '<span class="badge badge-expired">Suspended / موقوف</span>';
      if (expired) return '<span class="badge badge-expired">Expired / منتهي</span>';
      if (tier === 'trial') return '<span class="badge badge-trial">Trial / تجربة</span>';
      if (tier === 'lifetime' || tier === 'active' || tier === 'monthly' || tier === 'yearly') return '<span class="badge badge-active">Active / نشط</span>';
      return '<span class="badge badge-none">None / بدون</span>';
    }
    function expiryText(user) {
      if (user.subscription === 'lifetime') return '<span style="color:#CCFF00;">Lifetime</span>';
      if (!user.subEnd) return '—';
      return new Date(user.subEnd).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    const esc = (t) => String(t ?? '').replace(/[<>&"']/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));

    function renderUsers(users) {
      const q = searchInput.value.trim().toLowerCase();
      const st = statusFilter.value;
      let list = users;
      if (q) list = list.filter(u => (u.email || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q));
      if (st !== 'all') {
        list = list.filter(u => {
          const now = Date.now();
          if (st === 'active') return u.status !== 'suspended' && u.subscription !== 'none' && (!u.subEnd || u.subEnd > now);
          if (st === 'trial') return u.subscription === 'trial' && u.subEnd && u.subEnd > now;
          if (st === 'trial_expired') return u.subscription === 'trial' && u.subEnd && u.subEnd <= now && u.status !== 'suspended';
          if (st === 'expired') return u.subscription !== 'none' && u.subscription !== 'lifetime' && u.subEnd && u.subEnd <= now;
          if (st === 'suspended') return u.status === 'suspended';
          return true;
        });
      }

      if (!list.length) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-sm opacity-60">No users found / لا توجد مستخدمين</td></tr>`;
        return;
      }

      tableBody.innerHTML = list.map(u => `
        <tr class="hover:bg-[#171717]/50 transition-colors">
          <td>
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-[#333627] flex items-center justify-center text-xs font-bold" style="color:#CCFF00;">${esc((u.name || '?').charAt(0).toUpperCase())}</div>
              <span>${esc(u.name || '—')}</span>
            </div>
          </td>
          <td class="font-mono text-sm" style="color:#CCFF00;">${esc(u.email || '—')}</td>
          <td>${esc(TIER_LABEL[u.subscription] || u.subscription || 'None')}</td>
          <td class="whitespace-nowrap">${expiryText(u)}</td>
          <td>${tierBadge(u)}</td>
          <td>
            <div class="flex gap-1 flex-wrap justify-end">
              <button class="btn-sm btn-activate" data-action="edit" data-id="${esc(u.id)}">✎ Edit / تعديل</button>
              ${u.status === 'suspended'
                ? `<button class="btn-sm btn-activate" data-action="activate" data-id="${esc(u.id)}">Activate / تفعيل</button>`
                : `<button class="btn-sm btn-deactivate" data-action="suspend" data-id="${esc(u.id)}">Suspend / تعليق</button>`}
            </div>
          </td>
        </tr>`).join('');
    }

    function updateStats(users) {
      const now = Date.now();
      const active = users.filter(u => u.status !== 'suspended' && u.subscription !== 'none' && u.subscription !== 'lifetime' && u.subEnd && u.subEnd > now).length
        + users.filter(u => u.subscription === 'lifetime' && u.status !== 'suspended').length;
      const trial = users.filter(u => u.subscription === 'trial' && u.subEnd && u.subEnd > now && u.status !== 'suspended').length;
      const expired = users.filter(u => u.subscription !== 'none' && u.subscription !== 'lifetime' && u.subEnd && u.subEnd <= now).length;
      statTotal.textContent = users.length;
      statActive.textContent = active;
      statTrial.textContent = trial;
      statExpired.textContent = expired;
    }

    // ---- Subscription preview ----
    function previewText() {
      const tier = userSubType.value;
      if (tier === 'lifetime') return 'Lifetime — never expires / مدى الحياة — لا ينتهي';
      if (tier === 'none') return 'No subscription / بدون اشتراك';
      const days = parseInt(userDays.value) || DEFAULT_DAYS[tier] || 30;
      const end = Date.now() + days * 86400000;
      return `${days} days → ${new Date(end).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}  (${days} يوم)`;
    }
    function refreshPreview() {
      if (userSubType.value === 'lifetime' || userSubType.value === 'none') userDays.disabled = true;
      else userDays.disabled = false;
      subPreview.textContent = previewText();
    }
    window._setDays = (d) => { userDays.value = d; refreshPreview(); };

    userSubType.addEventListener('change', () => {
      if (userSubType.value !== 'lifetime' && userSubType.value !== 'none') {
        userDays.value = parseInt(userDays.value) || DEFAULT_DAYS[userSubType.value] || 30;
      }
      refreshPreview();
    });
    userDays.addEventListener('input', refreshPreview);

    // ---- Modal (create / edit) ----
    window._openCreate = () => {
      editId = null;
      userModalTitleText.textContent = 'Add User / إضافة مستخدم';
      passwordRow.classList.remove('hidden');
      userPassword.required = true;
      userEmail.disabled = false;
      userForm.reset();
      userSubType.value = 'monthly';
      userDays.value = 30;
      submitUserBtn.textContent = 'Create User / إنشاء';
      couponSection.classList.add('hidden');
      userModalMsg.textContent = '';
      refreshPreview();
      userModal.classList.remove('hidden');
    };

    window._editUser = (id) => {
      const u = allUsers.find(x => x.id === id);
      if (!u) return;
      editId = id;
      userModalTitleText.textContent = 'Edit Subscription / تعديل الاشتراك';
      passwordRow.classList.add('hidden');
      userPassword.required = false;
      userName.value = u.name || '';
      userEmail.value = u.email || '';
      userEmail.disabled = true;
      const tier = ['trial', 'monthly', 'yearly', 'lifetime', 'none'].includes(u.subscription) ? u.subscription : 'none';
      userSubType.value = tier;
      userDays.value = u.days || (tier === 'yearly' ? 365 : tier === 'trial' ? 14 : tier === 'lifetime' ? 0 : 30);
      submitUserBtn.textContent = 'Save Changes / حفظ';
      couponSection.classList.add('hidden');
      userModalMsg.textContent = '';
      refreshPreview();
      userModal.classList.remove('hidden');
    };

    cancelUserBtn.addEventListener('click', () => userModal.classList.add('hidden'));
    userModal.addEventListener('click', (e) => { if (e.target === userModal) userModal.classList.add('hidden'); });

    // ---- Save (create or edit subscription) ----
    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (loading) return;
      const name = userName.value.trim();
      const email = userEmail.value.trim().toLowerCase();
      const password = userPassword.value;
      const tier = userSubType.value;
      const days = parseInt(userDays.value) || DEFAULT_DAYS[tier] || 0;

      if (!name || !email) { userModalMsg.textContent = 'Name and email are required / الاسم والبريد مطلوبان'; return; }
      if (editId === null && password.length < 8) { userModalMsg.textContent = 'Password must be 8+ characters / 8 أحرف على الأقل'; return; }

      loading = true;
      userModalMsg.textContent = '';
      submitUserBtn.disabled = true;

      const now = Date.now();
      const subEnd = tier === 'lifetime' ? now + 36500 * 86400000 : tier === 'none' ? null : now + days * 86400000;
      const subscription = {
        tier,
        days: tier === 'lifetime' || tier === 'none' ? 0 : days,
      };

      try {
        if (editId === null) {
          if (IS_DEMO) {
            await demoCreateUser({
              name, email, password, status: 'active',
              subscription: tier === 'none' ? 'none' : (tier === 'lifetime' ? 'active' : tier),
              subStart: now, subEnd, subTier: tier, days: subscription.days,
              lastLogin: null,
            });
          } else {
            await api('/api/users', { method: 'POST', body: JSON.stringify({ email, password, full_name: name, subscription }) });
          }
        } else {
          if (IS_DEMO) {
            await demoUpdateUser(editId, {
              name,
              subscription: tier === 'none' ? 'none' : (tier === 'lifetime' ? 'active' : tier),
              subStart: (allUsers.find(x => x.id === editId) || {}).subStart || now,
              subEnd, subTier: tier, days: subscription.days, status: 'active',
            });
          } else {
            await api('/api/users/' + editId, { method: 'PATCH', body: JSON.stringify({ name, subscription }) });
          }
        }
        userModal.classList.add('hidden');
        await loadUsers();
      } catch (err) {
        console.error(err);
        userModalMsg.textContent = err.message || 'Failed / فشل';
      } finally {
        loading = false;
        submitUserBtn.disabled = false;
      }
    });

    // ---- Row actions: suspend / activate ----
    tableBody.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn || loading) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if (action === 'edit') { window._editUser(id); return; }

      if (!confirm(action === 'suspend'
        ? 'Suspend this user? / تعليق هذا المستخدم؟'
        : 'Activate this user? / تفعيل هذا المستخدم؟')) return;

      loading = true;
      try {
        const suspend = action === 'suspend';
        if (IS_DEMO) {
          await demoUpdateUser(id, { status: suspend ? 'suspended' : 'active' });
        } else {
          await api('/api/users/' + id, { method: 'PATCH', body: JSON.stringify({ suspend }) });
        }
        await loadUsers();
      } catch (err) {
        console.error(err);
        alert('Action failed / العملية فشلت: ' + err.message);
      } finally { loading = false; }
    });

    // ---- Filters / refresh ----
    searchInput.addEventListener('input', () => renderUsers(allUsers));
    statusFilter.addEventListener('change', () => renderUsers(allUsers));
    refreshBtn.addEventListener('click', loadUsers);

    // ---- Coupon system ----
    const COUPON_KEY = 'dp_coupons';
    const getCoupons = () => { try { return JSON.parse(localStorage.getItem(COUPON_KEY)) || []; } catch { return []; } };
    const saveCoupons = (c) => localStorage.setItem(COUPON_KEY, JSON.stringify(c));
    const findCoupon = (code) => getCoupons().find(c => c.code.toUpperCase() === code.toUpperCase() && !c.used);

    applyCouponBtn.addEventListener('click', () => {
      const code = couponCode.value.trim().toUpperCase();
      if (!code) { couponResult.textContent = 'Enter coupon code / أدخل رمز الكوبون'; couponResult.style.color = '#ff3366'; return; }
      const coupon = findCoupon(code);
      if (!coupon) { couponResult.textContent = 'Invalid or used coupon / كوبون غير صحيح'; couponResult.style.color = '#ff3366'; return; }
      if (coupon.type === 'days_14') { userSubType.value = 'trial'; userDays.value = 14; }
      else if (coupon.type === 'days_30') { userSubType.value = 'monthly'; userDays.value = 30; }
      else if (coupon.type === 'days_365') { userSubType.value = 'yearly'; userDays.value = 365; }
      const coupons = getCoupons();
      const i = coupons.findIndex(c => c.code.toUpperCase() === code);
      if (i !== -1) coupons[i].used = true;
      saveCoupons(coupons);
      couponResult.textContent = 'Coupon applied! / تم تطبيق الكوبون';
      couponResult.style.color = '#CCFF00';
      couponCode.value = '';
      refreshPreview();
    });

    addCouponBtn.addEventListener('click', () => { couponModal.classList.remove('hidden'); couponForm.reset(); couponModalMsg.textContent = ''; });
    cancelCouponBtn.addEventListener('click', () => couponModal.classList.add('hidden'));
    couponForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = couponCodeInput.value.trim().toUpperCase();
      const type = couponType.value;
      const value = parseInt(couponValue.value) || 50;
      if (!code) { couponModalMsg.textContent = 'Enter coupon code / أدخل رمز الكوبون'; return; }
      const coupons = getCoupons();
      if (coupons.some(c => c.code.toUpperCase() === code)) { couponModalMsg.textContent = 'Coupon code already exists / رمز الكوبون موجود مسبقاً'; return; }
      coupons.push({
        code, type, value,
        description: type === 'days_14' ? 'Free 2 weeks' : type === 'days_30' ? 'Free 1 month' : type === 'days_365' ? 'Free 1 year' : ` ${value}% discount`,
        used: false, createdAt: Date.now(),
      });
      saveCoupons(coupons);
      couponModalMsg.textContent = '✓ Coupon created successfully / تم إنشاء الكوبون بنجاح';
      couponModalMsg.style.color = '#CCFF00';
      couponForm.reset();
      setTimeout(() => { couponModal.classList.add('hidden'); couponModalMsg.textContent = ''; }, 1500);
    });

    // ---- Load ----
    loadUsers();
  </script>
</body>
</html>
