<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Digital Pulse — Admin Dashboard</title>
  <meta name="description" content="Manage users, subscriptions, and coupons" />
  <meta name="theme-color" content="#000000" />
  <script src="vendor/tailwind.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    body { min-height: max(884px, 100dvh); }
    .cyber-grid {
      background-image:
        linear-gradient(to right, rgba(68, 73, 51, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(68, 73, 51, 0.12) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow-volt { box-shadow: 0 0 60px rgba(204, 255, 0, 0.12); }

    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #333333;
    }
    .admin-table th {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c4c9ac;
      background-color: #0d0d0d;
    }
    .admin-table tr:hover td { background-color: rgba(204, 255, 0, 0.03); }
    .admin-table td { font-size: 0.9rem; color: #e2e4cf; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .badge-active { background-color: rgba(204, 255, 0, 0.15); color: #CCFF00; }
    .badge-trial { background-color: rgba(100, 100, 255, 0.15); color: #8888ff; }
    .badge-expired { background-color: rgba(255, 51, 102, 0.15); color: #ff3366; }
    .badge-none { background-color: rgba(100, 100, 100, 0.15); color: #666666; }

    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.7rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn-activate {
      background-color: rgba(204, 255, 0, 0.1);
      color: #CCFF00;
      border: 1px solid rgba(204, 255, 0, 0.3);
    }
    .btn-activate:hover { background-color: rgba(204, 255, 0, 0.2); }
    .btn-deactivate {
      background-color: rgba(255, 51, 102, 0.1);
      color: #ff3366;
      border: 1px solid rgba(255, 51, 102, 0.3);
    }
    .btn-deactivate:hover { background-color: rgba(255, 51, 102, 0.2); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-card {
      background-color: #0d0d0d;
      border: 1px solid #444933;
      border-radius: 1rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 40px rgba(204, 255, 0, 0.15);
    }
  </style>
</head>
<body class="font-body min-h-screen flex flex-col antialiased cyber-grid" style="background-color: rgb(0, 0, 0); color: #e2e4cf;">

  <!-- Top header -->
  <header class="flex justify-between items-center h-16 w-full z-50 border-b border-[#444933]" style="background-color:#000;">
    <div class="flex items-center gap-3">
      <span class="font-headline text-sm tracking-widest uppercase" style="color:#C3F400;">Admin Dashboard</span>
      <span class="arabic-text text-xs opacity-60" dir="rtl">لوحة المدير</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="adminEmailDisplay" class="text-sm opacity-70"></span>
      <button id="adminLogoutBtn" class="text-xs text-[#ff3366] hover:underline">Logout / خروج</button>
    </div>
  </header>

  <!-- Stats bar -->
  <div class="flex flex-wrap items-center gap-4 p-4 border-b border-[#444933]" style="background-color:#0a0a0a;">
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Total Users:</span>
      <span id="statTotal" class="font-headline text-lg" style="color:#CCFF00;">0</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Active:</span>
      <span id="statActive" class="font-headline text-lg" style="color:#CCFF00;">0</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Trial:</span>
      <span id="statTrial" class="font-headline text-lg" style="color:#8888ff;">0</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs uppercase tracking-widest opacity-60" style="color:#c4c9ac;">Expired:</span>
      <span id="statExpired" class="font-headline text-lg" style="color:#ff3366;">0</span>
    </div>

    <div class="ml-auto flex gap-2">
      <button id="refreshBtn" class="btn-sm bg-[#333333] text-[#e2e4cf] hover:bg-[#444444]">
        Refresh / تحديث
      </button>
      <button id="addCouponBtn" class="btn-sm bg-[#CCFF00] text-black hover:bg-[#B8E600]">
        + Add Coupon
      </button>
    </div>
  </div>

  <!-- Search & filter -->
  <div class="flex flex-wrap items-center gap-4 p-4 border-b border-[#444933]" style="background-color:#0d0d0d;">
    <div class="flex items-center gap-2 flex-1 min-w-[200px]">
      <input id="searchInput" type="text" placeholder="Search by email or name..."
        class="auth-input flex-1" style="background-color:#171717;" />
    </div>
    <select id="statusFilter" class="auth-input w-auto" style="background-color:#171717; cursor:pointer;">
      <option value="all">All / الكل</option>
      <option value="active">Active / نشط</option>
      <option value="trial">Trial / تجربة</option>
      <option value="trial_expired">Pending Activation / بانتظار التفعيل</option>
      <option value="expired">Expired / منتهي</option>
      <option value="suspended">Suspended / موقوف</option>
    </select>
  </div>

  <!-- Users table -->
  <div class="flex-1 overflow-auto">
    <table class="admin-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Subscription</th>
          <th>Expires</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="6" class="text-center py-8 text-sm opacity-60">Loading users...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <footer class="flex justify-center items-center py-4 border-t border-[#444933]" style="background-color:#000;">
    <p class="text-xs opacity-60" style="color:#c4c9ac;">© 2026 Digital Pulse — All rights reserved</p>
  </footer>

  <!-- Create/Edit User Modal -->
  <div id="userModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="font-headline text-xl mb-4 flex items-center gap-2" style="color:#CCFF00;">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Add User / إضافة مستخدم
      </h3>
      <form id="userForm" class="space-y-4">
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Full Name / الاسم الكامل</label>
          <input id="userName" type="text" required class="auth-input" />
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Email / البريد</label>
          <input id="userEmail" type="email" required class="auth-input" />
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Password / كلمة السر (7+ chars)</label>
          <input id="userPassword" type="password" required minlength="7" class="auth-input" />
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Subscription Type</label>
          <select id="userSubType" class="auth-input" style="background-color:#171717; cursor:pointer;">
            <option value="trial">Free Trial (2 weeks) / تجربة مجانية</option>
            <option value="monthly">Monthly / شهر</option>
            <option value="yearly">Yearly / سنة</option>
            <option value="lifetime">Lifetime / مدى الحياة</option>
            <option value="none">No subscription / بدون اشتراك</option>
          </select>
        </div>
        <div id="couponSection" class="hidden p-3 rounded-lg border border-[#444933]" style="background-color:#171717;">
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Apply Coupon Code</label>
          <div class="flex gap-2">
            <input id="couponCode" type="text" class="auth-input flex-1" placeholder="COUPON-XXXX" />
            <button id="applyCouponBtn" type="button" class="btn-sm bg-[#CCFF00] text-black">Apply</button>
          </div>
          <p id="couponResult" class="text-xs mt-1" style="color:#c4c9ac;"></p>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" id="cancelUserBtn" class="btn-sm bg-[#333333] text-[#e2e4cf]">Cancel / إلغاء</button>
          <button type="submit" class="btn-sm bg-[#CCFF00] text-black">Create User / إنشاء</button>
        </div>
      </form>
      <p id="userModalMsg" class="text-sm text-center mt-3" style="color:#ff3366;"></p>
    </div>
  </div>

  <!-- Coupon Modal -->
  <div id="couponModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="font-headline text-xl mb-4 flex items-center gap-2" style="color:#CCFF00;">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14H5V5h14m0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
        Add Coupon / إضافة كوبون
      </h3>
      <form id="couponForm" class="space-y-4">
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Coupon Code / رمز الكوبون</label>
          <input id="couponCodeInput" type="text" required class="auth-input uppercase" placeholder="COUPON-XXXX" />
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Discount Type</label>
          <select id="couponType" class="auth-input" style="background-color:#171717; cursor:pointer;">
            <option value="days_14">Free 2 weeks / 2 أسبوع مجانًا</option>
            <option value="days_30">Free 1 month / شهر مجاني</option>
            <option value="days_365">Free 1 year / سنة مجانية</option>
            <option value="percentage">Percentage discount / تخفيض نسبة</option>
          </select>
        </div>
        <div>
          <label class="text-xs uppercase tracking-widest opacity-60 block mb-1" style="color:#c4c9ac;">Value (if percentage)</label>
          <input id="couponValue" type="number" min="1" max="100" value="50" class="auth-input" style="background-color:#171717;" />
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" id="cancelCouponBtn" class="btn-sm bg-[#333333] text-[#e2e4cf]">Cancel / إلغاء</button>
          <button type="submit" class="btn-sm bg-[#CCFF00] text-black">Create Coupon / إنشاء</button>
        </div>
      </form>
      <p id="couponModalMsg" class="text-sm text-center mt-3" style="color:#ff3366;"></p>
    </div>
  </div>

  <script src="vendor/supabase-js.js"></script>
  <script type="module">
    // ============================================================
    // admin.js — Admin dashboard logic
    // ============================================================
    import { supabase } from './js/supabase-client.js';

    const $ = (sel, root = document) => root.querySelector(sel);

    // Elements
    const tableBody = $('#usersTableBody');
    const searchInput = $('#searchInput');
    const statusFilter = $('#statusFilter');
    const refreshBtn = $('#refreshBtn');
    const addCouponBtn = $('#addCouponBtn');
    const statTotal = $('#statTotal');
    const statActive = $('#statActive');
    const statTrial = $('#statTrial');
    const statExpired = $('#statExpired');
    const adminEmailDisplay = $('#adminEmailDisplay');
    const adminLogoutBtn = $('#adminLogoutBtn');

    // Modals
    const userModal = $('#userModal');
    const userForm = $('#userForm');
    const userName = $('#userName');
    const userEmail = $('#userEmail');
    const userPassword = $('#userPassword');
    const userSubType = $('#userSubType');
    const couponSection = $('#couponSection');
    const couponCode = $('#couponCode');
    const applyCouponBtn = $('#applyCouponBtn');
    const couponResult = $('#couponResult');
    const userModalMsg = $('#userModalMsg');
    const cancelUserBtn = $('#cancelUserBtn');

    const couponModal = $('#couponModal');
    const couponForm = $('#couponForm');
    const couponCodeInput = $('#couponCodeInput');
    const couponType = $('#couponType');
    const couponValue = $('#couponValue');
    const couponModalMsg = $('#couponModalMsg');
    const cancelCouponBtn = $('#cancelCouponBtn');

    let allUsers = [];
    let loading = false;

    // Check admin session
    if (!sessionStorage.getItem('dp_admin_token') && !sessionStorage.getItem('dp_demo_admin')) {
      window.location.href = 'admin.html';
    }

    const adminEmail = sessionStorage.getItem('dp_demo_admin') === '1'
      ? 'admin@gym.local'
      : (JSON.parse(localStorage.getItem('dp_current_user') || 'null') || {}).email || 'admin@gym.local';
    adminEmailDisplay.textContent = adminEmail;

    adminLogoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('dp_admin_token');
      sessionStorage.removeItem('dp_demo_admin');
      localStorage.removeItem('dp_current_user');
      window.location.href = 'index.html';
    });

    // ---- Demo helpers ----
    async function demoGetUsers() {
      const { demoUsersAll } = await import('../js/db.js');
      return demoUsersAll();
    }
    async function demoCreateUser(userData) {
      const { demoUsersAll, demoUsersSave, findDemoUser } = await import('../js/db.js');
      if (findDemoUser(userData.email)) {
        throw new Error('Email already exists / البريد موجود مسبقاً');
      }
      const users = demoUsersAll();
      users.push({ ...userData, id: 'U' + Date.now().toString(36).toUpperCase(), createdAt: Date.now() });
      demoUsersSave(users);
      return users[users.length - 1];
    }
    async function demoUpdateUser(userId, updates) {
      const { demoUsersAll, demoUsersSave } = await import('../js/db.js');
      const users = demoUsersAll();
      const idx = users.findIndex(u => u.id === userId);
      if (idx === -1) throw new Error('User not found / المستخدم غير موجود');
      users[idx] = { ...users[idx], ...updates };
      demoUsersSave(users);
      return users[idx];
    }
    async function demoSuspendUser(userId) {
      return demoUpdateUser(userId, { status: 'suspended' });
    }
    async function demoActivateUser(userId) {
      return demoUpdateUser(userId, { status: 'active' });
    }

    // ---- Coupon system (demo) ----
    const COUPON_KEY = 'dp_coupons';
    function getCoupons() {
      try { return JSON.parse(localStorage.getItem(COUPON_KEY)) || []; }
      catch { return []; }
    }
    function saveCoupons(coupons) {
      localStorage.setItem(COUPON_KEY, JSON.stringify(coupons));
    }
    function findCoupon(code) {
      const coupons = getCoupons();
      return coupons.find(c => c.code.toUpperCase() === code.toUpperCase() && !c.used);
    }

    // ---- Render users ----
    function renderUsers(users) {
      if (!users.length) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-sm opacity-60">No users found / لا توجد مستخدمين</td></tr>`;
        return;
      }

      const now = Date.now();
      tableBody.innerHTML = users.map(user => {
        const isExpired = user.subscription !== 'none' &&
          (user.subscription === 'trial' || user.subscription === 'active') &&
          now > user.subEnd;

        const statusBadge = isExpired
          ? '<span class="badge badge-expired">Expired / منتهي</span>'
          : user.subscription === 'trial'
          ? '<span class="badge badge-trial">Trial / تجربة</span>'
          : user.subscription === 'active'
          ? '<span class="badge badge-active">Active / نشط</span>'
          : user.status === 'suspended'
          ? '<span class="badge badge-expired">Suspended / موقوف</span>'
          : '<span class="badge badge-none">None / بدون</span>';

        const expiryDate = user.subEnd ? new Date(user.subEnd).toLocaleDateString('en-GB', {
          day: 'numeric', month: 'short', year: 'numeric'
        }) : '—';

        const canActivate = user.status === 'suspended' || !user.status;
        const canDeactivate = user.status === 'active' || user.subscription === 'active';

        return `<tr>
          <td>
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-[#333627] flex items-center justify-center text-xs font-bold" style="color:#CCFF00;">
                ${user.name?.charAt(0)?.toUpperCase() || '?'}
              </div>
              <span>${escapeHtml(user.name || '—')}</span>
            </div>
          </td>
          <td>${escapeHtml(user.email)}</td>
          <td>${user.subscription === 'trial' ? 'Free Trial (2 weeks)' :
               user.subscription === 'monthly' ? 'Monthly' :
               user.subscription === 'yearly' ? 'Yearly' :
               user.subscription === 'lifetime' ? 'Lifetime' :
               'None'}</td>
          <td>${expiryDate}</td>
          <td>${statusBadge}</td>
          <td>
            <div class="flex gap-1 flex-wrap">
              ${canActivate ? `<button class="btn-sm btn-activate activate-user" data-id="${user.id}">
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                Activate
              </button>` : ''}
              ${canDeactivate ? `<button class="btn-sm btn-deactivate deactivate-user" data-id="${user.id}">
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M17 16.17L15.59 7.58 14.17 9l-4.35 4.35L5.33 9l1.41 1.41L12 16.17V22H10V16.17l1.41-1.41L5.33 9 9 12.67 4.35 8.01 9 3.65 17 10.35 20.04 13.39 17 16.17z"/></svg>
                Suspend
              </button>` : ''}
              <button class="btn-sm bg-[#333333] text-[#e2e4cf]" onclick="window._editUser('${user.id}')">
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.812 9.937a1 1 0 1 1 1.5 1.536l-3.75 3.75a1 1 0 0 1-1.5-.036L3 21zM20.71 4.63a1 1 0 0 0-.96-1.27l-3.36-1.62a1 1 0 0 0-.96 0l-3.36 1.62a1 1 0 0 0-.96 1.27c-.56.87-1.07 1.99-1.25 2.29-.23.38-.15 1.02.46 1.68l5.05 5.05c.5.5 1.15.78 1.85.78h3.32c.7.01 1.35-.27 1.85-.78l5.05-5.05c.57-.66.66-1.3.46-1.68-.18-.3-1.59-2.42-4.75-4.13z"/></svg>
                Edit
              </button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---- Stats ----
    function updateStats(users) {
      const now = Date.now();
      statTotal.textContent = users.length;
      statActive.textContent = users.filter(u => u.status === 'active' && (!u.subEnd || u.subEnd > now)).length;
      statTrial.textContent = users.filter(u => u.subscription === 'trial' && (!u.subEnd || u.subEnd > now)).length;
      statExpired.textContent = users.filter(u => (u.subscription === 'trial' || u.subscription === 'active') && u.subEnd && u.subEnd <= now).length;
    }

    // ---- Load users ----
    async function loadUsers() {
      let users;
      try {
        const { data, error } = await supabase.from('users').select('*').order('createdAt', { ascending: false });
        if (error) throw error;
        users = data || [];
      } catch (err) {
        console.log('Supabase users fetch failed, using demo:', err.message);
        users = await demoGetUsers();
      }
      allUsers = users;
      const filtered = applyFilters(users);
      renderUsers(filtered);
      updateStats(users);
    }

    function applyFilters(users) {
      const search = searchInput.value.toLowerCase();
      const status = statusFilter.value;
      return users.filter(u => {
        if (status !== 'all') {
          if (status === 'active' && u.status !== 'active' && u.status !== 'trial') return false;
          if (status === 'trial' && u.subscription !== 'trial') return false;
          if (status === 'expired' && (!u.subEnd || u.subEnd > Date.now())) return false;
          if (status === 'suspended' && u.status !== 'suspended') return false;
        }
        if (search) {
          const match = (u.email || '').toLowerCase().includes(search) ||
            (u.name || '').toLowerCase().includes(search);
          if (!match) return false;
        }
        return true;
      });
    }

    // ---- Event listeners ----
    searchInput.addEventListener('input', () => {
      renderUsers(applyFilters(allUsers));
    });
    statusFilter.addEventListener('change', () => {
      renderUsers(applyFilters(allUsers));
    });
    refreshBtn.addEventListener('click', loadUsers);

    // ---- Activate / Deactivate ----
    tableBody.addEventListener('click', (e) => {
      const btn = e.target.closest('.activate-user, .deactivate-user');
      if (!btn) return;
      if (loading) return;
      const userId = btn.dataset.id;
      const action = btn.classList.contains('activate-user') ? 'activate' : 'suspend';

      setLoading(true);
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        let updated;
        try {
          const { error } = await supabase.from('users').update({
            status: action === 'activate' ? 'active' : 'suspended'
          }).eq('id', userId);
          if (error) throw error;
          updated = { ...allUsers.find(u => u.id === userId), status: action === 'activate' ? 'active' : 'suspended' };
        } catch (err) {
          console.log('Supabase update failed, using demo:', err.message);
          if (action === 'activate') updated = await demoActivateUser(userId);
          else updated = await demoSuspendUser(userId);
        }
        allUsers = allUsers.map(u => u.id === userId ? updated : u);
        loadUsers();
      } catch (err) {
        console.error('Action failed:', err);
      }

      setLoading(false);
      btn.disabled = false;
      btn.innerHTML = action === 'activate'
        ? `<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Activate`
        : `<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M17 16.17L15.59 7.58 14.17 9l-4.35 4.35L5.33 9l1.41 1.41L12 16.17V22H10V16.17l1.41-1.41L5.33 9 9 12.67 4.35 8.01 9 3.65 17 10.35 20.04 13.39 17 16.17z"/></svg> Suspend`;
    });

    // ---- Add User Modal ----
    const openUserModal = () => {
      userModal.classList.remove('hidden');
      userForm.reset();
      userModalMsg.textContent = '';
      couponSection.classList.add('hidden');
    };

    window._editUser = (userId) => {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;
      userName.value = user.name || '';
      userEmail.value = user.email;
      userPassword.value = '';
      userSubType.value = user.subscription === 'trial' ? 'trial' :
        user.subscription === 'monthly' ? 'monthly' :
        user.subscription === 'yearly' ? 'yearly' :
        user.subscription === 'lifetime' ? 'lifetime' : 'none';
      userModal.dataset.editId = userId;
      openUserModal();
    };

    addCouponBtn.addEventListener('click', () => {
      openUserModal();
      couponSection.classList.toggle('hidden');
    });

    cancelUserBtn.addEventListener('click', () => {
      userModal.classList.add('hidden');
      couponSection.classList.add('hidden');
    });

    // Apply coupon in create modal
    applyCouponBtn.addEventListener('click', async () => {
      const code = couponCode.value.trim().toUpperCase();
      if (!code) {
        couponResult.textContent = 'Enter coupon code / أدخل رمز الكوبون';
        return;
      }

      const coupon = findCoupon(code);
      if (!coupon) {
        couponResult.textContent = 'Invalid or used coupon / كوبون غير صحيح أو مستخدم';
        couponResult.style.color = '#ff3366';
        return;
      }

      // Apply coupon to form
      if (coupon.type === 'days_14') userSubType.value = 'trial';
      else if (coupon.type === 'days_30') userSubType.value = 'monthly';
      else if (coupon.type === 'days_365') userSubType.value = 'yearly';

      couponResult.textContent = `Coupon applied! / تم تطبيق الكوبون — ${coupon.description || 'Free period'}`;
      couponResult.style.color = '#CCFF00';

      // Mark coupon as used
      const coupons = getCoupons();
      const idx = coupons.findIndex(c => c.code.toUpperCase() === code);
      if (idx !== -1) coupons[idx].used = true;
      saveCoupons(coupons);
      couponCode.value = '';
    });

    // ---- Create User ----
    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (loading) return;

      const name = userName.value.trim();
      const email = userEmail.value.trim().toLowerCase();
      const password = userPassword.value;
      const subType = userSubType.value;

      if (!name || !email || !password) {
        userModalMsg.textContent = 'All fields are required / جميع الحقول مطلوبة';
        return;
      }
      if (password.length < 7) {
        userModalMsg.textContent = 'Password must be at least 7 characters / 7 أحرف على الأقل';
        return;
      }

      loading = true;
      userModalMsg.textContent = '';

      const now = Date.now();
      let subStart = now;
      let subEnd = null;
      let subscription = 'none';

      if (subType === 'trial') {
        subscription = 'trial';
        subEnd = now + 14 * 86400000; // 2 weeks
      } else if (subType === 'monthly') {
        subscription = 'active';
        subEnd = now + 30 * 86400000;
      } else if (subType === 'yearly') {
        subscription = 'active';
        subEnd = now + 365 * 86400000;
      } else if (subType === 'lifetime') {
        subscription = 'active';
        subEnd = null;
      }

      const newUser = {
        id: 'U' + Date.now().toString(36).toUpperCase(),
        name,
        email,
        password,
        status: 'active',
        subscription,
        subStart,
        subEnd,
        subTier: subType,
        createdAt: now,
        lastLogin: null,
      };

      try {
        let created;
        try {
          const { error } = await supabase.from('users').insert({
            name, email, password, status: 'active',
            subscription, subStart, subEnd, subTier: subType,
            created_at: new Date().toISOString()
          });
          if (error) throw error;
          created = { ...newUser, id: 'sup-' + Date.now() };
        } catch (err) {
          console.log('Supabase insert failed, using demo:', err.message);
          created = await demoCreateUser(newUser);
        }
        allUsers.unshift(created);
        loadUsers();
        userModalMsg.textContent = '✓ User created successfully / تم إنشاء المستخدم بنجاح';
        userModalMsg.style.color = '#CCFF00';
        setTimeout(() => {
          userModal.classList.add('hidden');
          userModalMsg.textContent = '';
        }, 2000);
      } catch (err) {
        userModalMsg.textContent = err.message || 'Failed to create user / فشل إنشاء المستخدم';
        loading = false;
      }
    });

    // ---- Create Coupon ----
    couponForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = couponCodeInput.value.trim().toUpperCase();
      const type = couponType.value;
      const value = parseInt(couponValue.value) || 50;

      if (!code) {
        couponModalMsg.textContent = 'Enter coupon code / أدخل رمز الكوبون';
        return;
      }

      const coupons = getCoupons();
      if (coupons.some(c => c.code.toUpperCase() === code)) {
        couponModalMsg.textContent = 'Coupon code already exists / رمز الكوبون موجود مسبقاً';
        return;
      }

      const newCoupon = {
        code,
        type,
        value,
        description: type === 'days_14' ? 'Free 2 weeks' :
                    type === 'days_30' ? 'Free 1 month' :
                    type === 'days_365' ? 'Free 1 year' :
                    ` ${value}% discount`,
        used: false,
        createdAt: Date.now(),
      };

      coupons.push(newCoupon);
      saveCoupons(coupons);

      couponModalMsg.textContent = '✓ Coupon created successfully / تم إنشاء الكوبون بنجاح';
      couponModalMsg.style.color = '#CCFF00';
      couponForm.reset();
      setTimeout(() => {
        couponModal.classList.add('hidden');
        couponModalMsg.textContent = '';
      }, 2000);
    });

    cancelCouponBtn.addEventListener('click', () => {
      couponModal.classList.add('hidden');
      couponModalMsg.textContent = '';
    });

    addCouponBtn.addEventListener('click', () => {
      couponModal.classList.toggle('hidden');
    });

    // ---- Load ----
    loadUsers();
  </script>
</body>
</html>
