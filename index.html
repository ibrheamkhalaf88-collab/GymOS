<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Digital Pulse</title>
<meta name="description" content="Digital Pulse - Gym Management System">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="vendor/tailwind.js" defer></script>
<script>
  tailwind.config = { theme: { extend: {} } };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Tajawal:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-arabic { font-family: 'Tajawal', sans-serif; }
  .font-cairo { font-family: 'Cairo', sans-serif; }
  .glow-effect { box-shadow: 0 0 20px rgba(204, 255, 0, 0.4); }
  .glow-volt { box-shadow: 0 0 20px rgba(204, 255, 0, 0.15); }
  .text-glow { text-shadow: 0 0 10px rgba(204, 255, 0, 0.3); }
  .neon-border { box-shadow: 0 0 15px rgba(204, 255, 0, 0.2); border: 1px solid rgba(204, 255, 0, 0.3); }
  .arabic-text { direction: rtl; }
  body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="bg-[#000000] text-white h-full w-full overflow-x-hidden antialiased selection:bg-[#CCFF00] selection:text-black">
<div id="loadingOverlay" class="fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center gap-4"><div class="w-10 h-10 border-4 border-[#CCFF00] border-t-transparent rounded-full animate-spin"></div><p class="font-headline tracking-widest text-[#CCFF00] text-xs uppercase">Loading…</p></div>
<div id="offlineBanner" class="hidden fixed top-0 inset-x-0 z-[9998] bg-[#FF3366] text-white text-center py-2 font-headline text-xs uppercase">Offline — لا يوجد اتصال</div>
<div id="slideRoot" class="min-h-[max(884px,100dvh)] flex flex-col"></div>
<script>
(function(){ function setOffline(on){ var b=document.getElementById('offlineBanner'); if(b) b.classList.toggle('hidden', !on); } window.addEventListener('online', ()=>setOffline(false)); window.addEventListener('offline', ()=>setOffline(true)); setOffline(!navigator.onLine); window.addEventListener('load', ()=>{ var o=document.getElementById('loadingOverlay'); if(o) setTimeout(()=>o.remove(),400); }); setTimeout(function(){ var o=document.getElementById('loadingOverlay'); if(o) o.remove(); },5000);})();
</script>
<script src="js/onboarding.js"></script>
</body>
</html>
