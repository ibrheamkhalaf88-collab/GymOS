<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Gym Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            volt: '#CCFF00',
            darkbg: '#000000',
            darksurface: '#111111',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Subtle glow effect for cyber-athletic feel */
    .glow-volt {
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.15);
    }
    
    /* Ensure Arabic text reads well */
    .arabic-text {
      direction: rtl;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-darkbg text-white min-h-screen flex flex-col font-sans antialiased selection:bg-volt selection:text-black">
<!-- Main Container -->
<div class="flex-1 flex flex-col w-full max-w-md mx-auto px-6 pt-12 pb-8 h-[884px]" data-purpose="mobile-container">
<!-- BEGIN: ImageSection -->
<!-- Displays the main feature illustration with a subtle industrial border -->
<main class="flex-1 flex items-center justify-center min-h-[353px] w-full" data-purpose="illustration-container">
<div class="relative w-full max-w-[320px] aspect-square rounded-2xl overflow-hidden border border-gray-800 glow-volt p-2 bg-darkbg">
<img alt="Smart data charts illustration" class="w-full h-full object-cover rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJy0cGAeMFxY2irgOtmR1cU33BfpebCQzyysMEbw1vDCUVCSN4MW1IvR7_LtLRbQqBEfqhryylSMQVDXCCBpkbJBTCTDVICLrPQCEM0GPimEaa9p5QlP4__LLO78jsSoeik6c1p93PEdeSU7hSsuU_XmlhicTta7kiYm-ugR9XKvi17dUV8H-EBOa4JDYUUgfYA2qxph3vl8b2_JHhQ1HQkMXmZHkk_bbFmE7nbvUICyY2qypWxMeL"/>
</div>
</main>
<!-- END: ImageSection -->
<!-- BEGIN: ContentSection -->
<!-- Bilingual text content explaining the feature -->
<section class="mt-8 mb-10 flex flex-col gap-4 text-center" data-purpose="text-content">
<div class="flex flex-col gap-2">
<!-- English Headline -->
<h1 class="text-2xl font-black uppercase tracking-tight text-white leading-none">
          Smart Decisions Based on Data
        </h1>
<!-- Arabic Headline -->
<h2 class="text-xl font-bold text-gray-200 leading-tight arabic-text">
          قرارات ذكية قائمة على البيانات
        </h2>
</div>
<div class="flex flex-col gap-3 mt-2">
<!-- English Subtext -->
<p class="text-sm text-gray-400 font-medium leading-relaxed">
          Monitor your gym growth with daily numbers and reports, raise work efficiency and focus on developing your club.
        </p>
<!-- Arabic Subtext -->
<p class="text-sm text-gray-400 font-medium leading-relaxed arabic-text">
          راقب نمو صالتك بالأرقام والتقارير اليومية، ارفع كفاءة العمل وركز على تطوير ناديك.
        </p>
</div>
</section>
<!-- END: ContentSection -->
<!-- BEGIN: NavigationSection -->
<!-- Bottom controls including pagination dots and the primary action button -->
<footer class="mt-auto flex flex-col items-center gap-8 w-full" data-purpose="onboarding-controls">
<!-- Page Indicators -->
<div class="flex items-center gap-2" data-purpose="pagination-dots">
<div class="w-2 h-2 rounded-full bg-gray-700 transition-colors"></div>
<div class="w-8 h-2 rounded-full bg-volt transition-all shadow-[0_0_8px_rgba(204,255,0,0.4)]"></div>
<div class="w-2 h-2 rounded-full bg-gray-700 transition-colors"></div>
</div>
<!-- Action Button -->
<button class="w-full bg-volt text-black font-black text-lg py-4 rounded-lg uppercase tracking-widest hover:bg-[#d4ff33] active:scale-[0.98] transition-all focus:outline-none focus:ring-4 focus:ring-volt/50" data-purpose="next-button" type="button">
        Next
      </button>
</footer>
<!-- END: NavigationSection -->
</div>
</body></html>
