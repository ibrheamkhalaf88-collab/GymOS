name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases and attach files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare web assets & sync Capacitor
        run: npm run sync && npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/DigitalPulse-debug.apk

      # Release APK on version tags (signed with debug key for testing)
      - name: Build Release Bundle (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalPulse-debug-apk
          path: output/DigitalPulse-debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/DigitalPulse-debug.apk

  # ── Windows desktop build (Electron portable exe) ──
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare web assets
        run: node scripts/sync-www.js

      - name: Bundle www/ into desktop app
        run: Copy-Item -Recurse -Force www desktop/www

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows portable exe
        working-directory: desktop
        run: npx electron-builder --win portable --publish never

      - name: Rename exe
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName ../output/DigitalPulse-Windows-Portable.exe

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalPulse-windows-exe
          path: output/DigitalPulse-Windows-Portable.exe

      - name: Attach Windows exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/DigitalPulse-Windows-Portable.exe