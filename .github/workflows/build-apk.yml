name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases and attach files

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level so the step `if:` guards can read them — the `secrets`
      # context is not allowed in `steps.if`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare web assets & sync Capacitor
        run: npm run sync && npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy Debug APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/DigitalPulse-debug.apk

      # Release APK on version tags. index.html downloads
      # releases/latest/download/app-release.apk, so the attached asset MUST
      # be named app-release.apk. Without keystore.properties Gradle falls
      # back to the debug signing key (android/app/build.gradle), which keeps
      # tag builds working until the KEYSTORE_* secrets are configured.
      - name: Restore keystore from base64 secret
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/digitalpulse-release.jks
          ls -la android/digitalpulse-release.jks

      - name: Create keystore.properties from secrets
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != ''
        # printf (not a heredoc): a quoted format string keeps $ and backticks
        # inside the password literal, and nothing is echoed to the log.
        run: |
          printf 'storeFile=digitalpulse-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build Release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy Release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/app-release.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalPulse-debug-apk
          path: output/DigitalPulse-debug.apk

      - name: Attach Release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/app-release.apk
          make_latest: true

  # ── Windows desktop build (Electron portable exe) ──
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare web assets
        run: node scripts/sync-www.js

      - name: Bundle www/ into desktop app
        run: Copy-Item -Recurse -Force www desktop/www

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows portable exe
        working-directory: desktop
        run: npx electron-builder --win portable --publish never

      - name: Rename exe
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName output/DigitalPulse-Windows-Portable.exe

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalPulse-windows-exe
          path: desktop/output/DigitalPulse-Windows-Portable.exe

      - name: Attach Windows exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/output/DigitalPulse-Windows-Portable.exe