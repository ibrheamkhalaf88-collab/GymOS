name: Deploy to GitHub Pages & Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:  # يدوي من واجهة GitHub

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'
  SUPABASE_PROJECT_REF: 'mwfbgucayjgbbvcyelbo'

jobs:
  # ============================================================
  # 1️⃣ BUILD & TEST
  # ============================================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ steps.build.outputs.build_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        id: build
        run: |
          NODE_ENV=production node scripts/build.js --output dist
          echo "build_dir=dist" >> $GITHUB_OUTPUT

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✅ index.html exists"
          test -f dist/js/config.js && echo "✅ config.js exists"
          grep -q "REPLACE_WITH_ROTATED_ANON_KEY_AT_DEPLOY_TIME" dist/js/config.js && echo "✅ Anon key placeholder present"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ============================================================
  # 2️⃣ DEPLOY TO GITHUB PAGES
  # ============================================================
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Inject Supabase Anon Key
        run: |
          # استبدال الـ placeholder بالمفتاح الحقيقي من GitHub Secrets
          sed -i "s|REPLACE_WITH_ROTATED_ANON_KEY_AT_DEPLOY_TIME|${{ secrets.SUPABASE_ANON_KEY }}|g" dist/js/config.js
          echo "✅ Injected SUPABASE_ANON_KEY into config.js"
          head -35 dist/js/config.js | tail -5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # 3️⃣ DEPLOY SUPABASE EDGE FUNCTIONS
  # ============================================================
  deploy-supabase:
    name: Deploy Supabase Edge Functions
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "latest"

      - name: Deploy gymos-api
        run: |
          supabase functions deploy gymos-api \
            --project-ref ${{ env.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt

      - name: Deploy gymos-drive-backup
        run: |
          supabase functions deploy gymos-drive-backup \
            --project-ref ${{ env.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt

      - name: Set Function Secrets (gymos-api)
        if: secrets.ADMIN_EMAIL != '' && secrets.ADMIN_PASSWORD != ''
        run: |
          supabase secrets set \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            --project-ref ${{ env.SUPABASE_PROJECT_REF }}

      - name: Set Function Secrets (gymos-drive-backup)
        if: secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_SECRET != ''
        run: |
          supabase secrets set \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            --project-ref ${{ env.SUPABASE_PROJECT_REF }}

      - name: Verify deployments
        run: |
          echo "🔍 Checking gymos-api health..."
          curl -sf "https://${{ env.SUPABASE_PROJECT_REF }}.functions.supabase.co/gymos-api/api/health" | jq .
          echo "🔍 Checking gymos-drive-backup health..."
          curl -sf "https://${{ env.SUPABASE_PROJECT_REF }}.functions.supabase.co/gymos-drive-backup/health" | jq .

      - name: Reminder - Apply Migrations Manually
        if: always()
        run: |
          echo "⚠️ REMINDER: These migrations must be applied manually in Supabase SQL Editor:"
          echo "  1. supabase/migrations/0004_lockdown_rls_complete.sql"
          echo "  2. supabase/migrations/0007_drive_tokens.sql"
          echo "  3. supabase/migrations/0008_admin_audit_error_log.sql"
          echo "Run them in order at: https://supabase.com/dashboard/project/${{ env.SUPABASE_PROJECT_REF }}/sql"

  # ============================================================
  # 4️⃣ POST-DEPLOY VERIFICATION
  # ============================================================
  verify:
    name: Post-Deploy Verification
    needs: [deploy-pages, deploy-supabase]
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages
        run: |
          URL="https://ibrheamkhalaf88-collab.github.io/GymOS/"
          echo "🌐 Checking $URL"
          curl -sf -o /dev/null -w "%{http_code}" "$URL" | grep -q "200" && echo "✅ GitHub Pages OK" || echo "❌ GitHub Pages failed"

      - name: Verify Supabase Functions
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          API="https://${{ env.SUPABASE_PROJECT_REF }}.functions.supabase.co/gymos-api"
          echo "🔍 Checking $API/api/health"
          curl -sf -H "apikey: $SUPABASE_ANON_KEY" "$API/api/health" | jq .
          echo "✅ Supabase API OK"

      - name: Verify Anon Key Injection
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "https://ibrheamkhalaf88-collab.github.io/GymOS/js/config.js" | \
            grep -q "$SUPABASE_ANON_KEY" && echo "✅ Anon key correctly injected in production config" || echo "❌ Anon key NOT found in production config"

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Pages | ${{ needs.deploy-pages.result }} | https://ibrheamkhalaf88-collab.github.io/GymOS/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase API | ${{ needs.deploy-supabase.result }} | https://${{ env.SUPABASE_PROJECT_REF }}.functions.supabase.co/gymos-api |" >> $GITHUB_STEP_SUMMARY
          echo "| Drive Backup | ${{ needs.deploy-supabase.result }} | https://${{ env.SUPABASE_PROJECT_REF }}.functions.supabase.co/gymos-drive-backup |" >> $GITHUB_STEP_SUMMARY