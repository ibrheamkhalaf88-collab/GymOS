name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "server/**"
  workflow_dispatch:

jobs:
  # Migrations were never applied by CI before 2026-09-26 — the old workflow only
  # linked the project, set secrets and deployed the function. That is how the
  # production database ended up without RLS (full anonymous read/write on
  # public.codes and public.gyms) while the repo's SQL said it should have it.
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately. "latest" makes setup-cli resolve the newest
          # release through the GitHub API, which fails the entire job on a rate
          # limit -- exactly what happened on 2026-09-26. Bump this by hand.
          version: 2.118.0

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply database migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-supabase:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately. "latest" makes setup-cli resolve the newest
          # release through the GitHub API, which fails the entire job on a rate
          # limit -- exactly what happened on 2026-09-26. Bump this by hand.
          version: 2.118.0

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Supabase Secrets (JWT + Admin)
        run: |
          supabase secrets set \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            ALLOWED_ORIGIN="${{ secrets.ALLOWED_ORIGIN }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Function gymos-api
        run: supabase functions deploy gymos-api --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
