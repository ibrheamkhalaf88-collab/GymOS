# Re-applies the custom SMTP configuration AND all branded auth-email
# templates (Gmail) via the Management API. Templates live in the repo at
# supabase/auth-email-templates/ — edit the files there, run this workflow.
# Idempotent — safe to run any time emails stop arriving or look off-brand.
# NOTE: smtp_pass is never printed; jq selects only non-secret fields, and
# GitHub masks secret values in logs.
name: Maintain SMTP Settings

on:
  workflow_dispatch:

jobs:
  smtp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (templates + subjects live in the repo)
        uses: actions/checkout@v4

      - name: Read current SMTP config (password never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            | jq '{smtp_host, smtp_port, smtp_user, smtp_sender_name, smtp_admin_email}'

      - name: Apply correct SMTP settings (idempotent)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          curl -s -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -d "{\"smtp_host\":\"smtp.gmail.com\",\"smtp_port\":587,\"smtp_admin_email\":\"digitalpulse.ps@gmail.com\",\"smtp_sender_name\":\"Digital Pulse\",\"smtp_user\":\"digitalpulse.ps@gmail.com\",\"smtp_pass\":\"$SMTP_APP_PASSWORD\"}" \
            | jq '{smtp_host, smtp_port, smtp_user, smtp_sender_name, smtp_admin_email}'

      - name: Confirm applied config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            | jq '{smtp_host, smtp_port, smtp_user, smtp_sender_name, smtp_admin_email}'

      - name: Apply all branded auth-email templates (confirmation, recovery, invite, email_change)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          DIR=supabase/auth-email-templates
          BODY=$(jq -n \
            --arg csub "$(jq -r '.confirmation' "$DIR/subjects.json")" \
            --rawfile ctpl "$DIR/confirmation.html" \
            --arg rsub "$(jq -r '.recovery' "$DIR/subjects.json")" \
            --rawfile rtpl "$DIR/recovery.html" \
            --arg isub "$(jq -r '.invite' "$DIR/subjects.json")" \
            --rawfile itpl "$DIR/invite.html" \
            --arg esub "$(jq -r '.email_change' "$DIR/subjects.json")" \
            --rawfile etpl "$DIR/email_change.html" \
            '{mailer_subjects_confirmation:$csub, mailer_templates_confirmation_content:$ctpl,
              mailer_subjects_recovery:$rsub, mailer_templates_recovery_content:$rtpl,
              mailer_subjects_invite:$isub, mailer_templates_invite_content:$itpl,
              mailer_subjects_email_change:$esub, mailer_templates_email_change_content:$etpl}')
          curl -s -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -d "$BODY" \
            | jq '{applied: (.smtp_host != null)}'

      - name: Verify templates saved (non-secret fields only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            | jq 'with_entries(select(.key | startswith("mailer_"))) | to_entries | map({key: .key, set: (.value != null), len: (if (.value|type) == "string" then (.value | length) else null end), branded: (if (.key | startswith("mailer_templates")) then (.value | contains("icon-192.png")) else null end)})'

      - name: Read auth logs around the maintenance run (delivery verdict)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -s --get -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs.all" \
            --data-urlencode 'sql=SELECT datetime(timestamp), event_message FROM auth_logs WHERE timestamp >= now() - INTERVAL 2 HOUR ORDER BY timestamp DESC LIMIT 60' \
            -w "\nHTTP_CODE=%{http_code}\n" | head -c 8000
