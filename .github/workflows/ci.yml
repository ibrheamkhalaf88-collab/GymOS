# Quality gates ONLY. Every deploy lives in its own workflow so two runs can
# never publish GitHub Pages (or the same Edge Function) at the same time:
#   deploy-pages.yml     -> GitHub Pages
#   deploy-supabase.yml  -> migrations + gymos-api
#   build-apk.yml        -> Android APK
name: CI — Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check Edge Function
        run: npx tsc -p supabase/functions/tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:prod

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/js/config.js
          test -f dist/js/store.js
          test -f dist/vendor/xlsx.full.min.js
