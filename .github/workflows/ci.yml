name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  # Release asset name - must match the download link in index.html
  RELEASE_APK_NAME: 'app-release.apk'

jobs:
  # ---------- Lint & Test ----------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # ---------- Build Web ----------
  build-web:
    name: Build Web (verify no errors)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync www for Capacitor
        run: npm run sync

      - name: Verify www assets exist
        run: |
          test -f www/index.html
          test -f www/sw.js
          test -f www/js/app.js
          test -f www/js/store.js
          test -f www/vendor/xlsx.full.min.js

  # ---------- Build Android APK ----------
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync www for Capacitor
        run: npm run sync

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Restore keystore from base64 secret
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/digitalpulse-release.jks
          ls -la android/digitalpulse-release.jks

      - name: Create keystore.properties from secrets
        if: ${{ secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=digitalpulse-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          # Do NOT echo keystore.properties to logs (contains secrets)

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify Release APK exists
        run: |
          ls -la android/app/build/outputs/apk/release/app-release.apk

      - name: Copy APK for release asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ${{ env.RELEASE_APK_NAME }}
          ls -la ${{ env.RELEASE_APK_NAME }}

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymos-release-apk
          path: ${{ env.RELEASE_APK_NAME }}
          retention-days: 30

  # ---------- Deploy to GitHub Pages ----------
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, build-web]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync www for Capacitor
        run: npm run sync

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- Create/Update Release with APK (only on version tags) ----------
  release-apk:
    name: Create Release with APK
    runs-on: ubuntu-latest
    needs: [build-android, deploy-pages]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: gymos-release-apk
          path: ./apk

      - name: Verify APK exists
        run: |
          ls -la ${{ env.RELEASE_APK_NAME }}
          file ${{ env.RELEASE_APK_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Digital Pulse ${{ github.ref_name }}"
          body: |
            ## Digital Pulse Android APK
            
            **Version:** ${{ github.ref_name }}
            **Build Date:** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            **Commit:** ${{ github.sha }}
            
            ### Install
            1. Download `app-release.apk` below
            2. Enable "Install from unknown sources" in Android settings
            3. Open the APK and install
            
            ### Features
            - ✅ Offline-first (works 100% offline)
            - ✅ Cloud sync across devices
            - ✅ Google Drive automatic backup (configure in Settings)
            - ✅ Excel/CSV import/export
            - ✅ Push notifications (requires google-services.json)
            - ✅ Arabic/English UI
            
            ---
            *Auto-generated by GitHub Actions on tag push*
          files: ${{ env.RELEASE_APK_NAME }}
          make_latest: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Deploy Supabase Edge Function ----------
  deploy-supabase:
    name: Deploy Supabase Edge Function
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ORG_ID: ${{ secrets.SUPABASE_ORG_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Supabase Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          pwsh ./deploy-supabase.ps1 -Token "${{ secrets.SUPABASE_ACCESS_TOKEN }}" -ProjectRef "${{ secrets.SUPABASE_PROJECT_REF }}" -OrgId "${{ secrets.SUPABASE_ORG_ID }}" -AdminEmail "${{ secrets.ADMIN_EMAIL }}" -AdminPassword "${{ secrets.ADMIN_PASSWORD }}"
        shell: pwsh