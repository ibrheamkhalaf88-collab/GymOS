<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Pulse — Authentication</title>
  <meta name="theme-color" content="#000000" />
  <script src="../vendor/tailwind.js"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <style>
    body { min-height: max(884px, 100dvh); background-color: #000; }
    .cyber-grid {
      background-image:
        linear-gradient(to right, rgba(68, 73, 51, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(68, 73, 51, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="font-body min-h-screen flex flex-col antialiased cyber-grid items-center justify-center" style="color: #e2e4cf;">

  <div class="w-full max-w-md p-8 text-center">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full border border-[#8e9379] flex items-center justify-center" style="background-color:#333627;">
      <svg class="h-8 w-8 text-[#CCFF00]" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>
    <h2 class="font-headline text-xl uppercase tracking-widest mb-2" id="cbStatus">Signing you in</h2>
    <p class="text-sm text-muted mb-6" id="cbSub">Redirecting to your dashboard.</p>
    <div class="flex justify-center">
      <div class="w-10 h-10 border-4 border-[#CCFF00] border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- APK login: show the way back to the app at once, before anything else loads -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('native') !== '1' || q.get('error')) return;
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
      if (!q.get('code') && !/(^|[#&])access_token=/.test(location.hash)) return;
      window.__dpAppHandoff = true;

      // Only a token hash is needed; Supabase's empty "#sb=" would add a second
      // "#" to the intent URL below.
      var payload = location.search + (q.get('code') ? '' : location.hash);
      var customUrl = 'com.digitalpulse.gym://auth/callback.html' + payload;
      var intentUrl = 'intent://auth/callback.html' + payload +
        '#Intent;scheme=com.digitalpulse.gym;package=com.digitalpulse.gym;' +
        'S.browser_fallback_url=' + encodeURIComponent(customUrl) + ';end';

      document.getElementById('cbStatus').textContent = 'ارجع للتطبيق';
      document.getElementById('cbSub').textContent = 'اضغط الزر لإكمال تسجيل الدخول داخل التطبيق / Tap to finish signing in inside the app';
      var card = document.querySelector('.w-full.max-w-md');
      card.querySelector('.animate-spin').parentNode.remove();

      // A real link: a tap on it is what Chrome always lets open the app.
      var link = document.createElement('a');
      link.id = 'openAppLink';
      link.href = /Android/i.test(navigator.userAgent) ? intentUrl : customUrl;
      link.textContent = 'ارجع للتطبيق / Open the app';
      link.style.cssText = 'display:block;padding:18px;border-radius:14px;background:#CCFF00;color:#000;font-size:18px;font-weight:800;text-decoration:none;text-align:center;';
      card.appendChild(link);

      // Try once on its own too; if Chrome blocks this, the link above still works.
      setTimeout(function () { try { location.href = link.href; } catch (e) { /* the link remains */ } }, 150);
    })();
  </script>

  <!-- Handle the OAuth callback — runs immediately -->
  <script src="../vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase-client.js';
    import { APP_BASE } from '../js/config.js';
    import { writeSession } from '../js/session.js';

    const statusEl = document.getElementById('cbStatus');
    const subEl = document.getElementById('cbSub');
    const setStatus = (t, s) => {
      if (t) statusEl.textContent = t;
      if (s) subEl.textContent = s;
    };

    const REF = 'mwfbgucayjgbbvcyelbo';
    const SB_KEY = 'sb-' + REF + '-auth-token';
    const NOW = Date.now();
    let done = false;

    // ?return= comes straight from the URL, so it must never be resolved against
    // the origin: the old `new URL(returnUrl.startsWith('/') ? returnUrl : '/' +
    // returnUrl, origin)` sent the user to https://evil.com for
    // ?return=//evil.com — an open redirect on the one page that just handed them
    // a valid session. Only the app's own pages are accepted now; every other
    // value (absolute URL, //host, ../x) falls back to app.html.
    const RETURN_ALLOWED = ['app.html', 'onboarding.html', 'activate.html', 'index.html'];
    function resolveReturnUrl() {
      const want = new URLSearchParams(window.location.search).get('return');
      const page = RETURN_ALLOWED.includes(want) ? want : 'app.html';
      // Resolve against THIS page (../GymOS/auth/callback.html), not the origin
      // root: '/app.html' pointed at https://<user>.github.io/app.html and 404'd
      // because the site lives under /GymOS/. '../' works on GitHub Pages, on
      // localhost and inside the APK (its origin is https://localhost).
      return new URL('../' + page, window.location.href).href;
    }

    const isNativePlatform = () =>
      !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());

    function hashTokens() {
      try {
        const hp = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        return { access_token: hp.get('access_token'), refresh_token: hp.get('refresh_token') };
      } catch {
        return { access_token: null, refresh_token: null };
      }
    }

    // Sends the OAuth result back to the installed APK.
    // Chrome ignores plain custom-scheme navigations coming from a page it
    // opened in a Custom Tab unless there is a user gesture, but it does honour
    // an Android `intent://` URL — so that is the primary mechanism, with the
    // custom scheme and an explicit button as fallbacks.
    function openInstalledApp(payload) {
      const customUrl = 'com.digitalpulse.gym://auth/callback.html' + (payload || '');
      const intentUrl = 'intent://auth/callback.html' + (payload || '') +
        '#Intent;scheme=com.digitalpulse.gym;package=com.digitalpulse.gym;' +
        'S.browser_fallback_url=' + encodeURIComponent(customUrl) + ';end';

      setStatus('Opening the app', 'Completing sign in inside the app… / إكمال تسجيل الدخول في التطبيق…');

      try {
        const a = document.createElement('a');
        a.href = intentUrl;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch { /* fall through to the location attempts below */ }

      setTimeout(() => { try { window.location.href = intentUrl; } catch { /* ignore */ } }, 250);
      setTimeout(() => { try { window.location.href = customUrl; } catch { /* ignore */ } }, 1200);

      try {
        const btn = document.createElement('button');
        btn.textContent = 'Open app / فتح التطبيق';
        btn.style.cssText = 'margin-top:16px;padding:12px 18px;border-radius:8px;border:1px solid #CCFF00;background:#CCFF00;color:#000;cursor:pointer;font-size:14px;font-weight:bold;';
        btn.onclick = () => { try { window.location.href = intentUrl; } catch { /* ignore */ } };
        document.querySelector('.w-full.max-w-md').appendChild(btn);
      } catch { /* ignore */ }
    }

    // THE bug that stranded users on the website: this page finished the login
    // itself whenever a session appeared, so a Google login started from the
    // APK ended logged-in *in the browser* while the app stayed logged out
    // ("تمام" → website home page). When the APK started the flow it marks the
    // redirect with native=1; in that case we never complete here — we always
    // bounce the result back to the app.
    //   ?code=…    → the app exchanges it with its own PKCE verifier
    //   #tokens    → the app adopts the session directly
    async function handOffToAppIfRequested() {
      if (isNativePlatform()) return false;
      const params = new URLSearchParams(location.search);
      if (params.get('native') !== '1') return false;  // normal web login: unchanged
      if (window.__dpAppHandoff) return true;          // the page already shows the link
      if (params.get('error')) return false;           // let the error card show

      if (params.get('code')) { openInstalledApp(location.search + location.hash); return true; }
      if (/(^|[#&])access_token=/.test(location.hash)) { openInstalledApp(location.search + location.hash); return true; }

      // No payload in the URL (already-consumed link, or the browser restored
      // this page). If this browser already holds a session for the account we
      // hand its tokens over instead of leaving the user signed in on the web.
      try {
        const { data } = await supabase.auth.getSession();
        const sess = data && data.session;
        if (sess && sess.access_token && sess.refresh_token) {
          openInstalledApp('#access_token=' + encodeURIComponent(sess.access_token) +
            '&refresh_token=' + encodeURIComponent(sess.refresh_token) +
            '&token_type=bearer&type=oauth');
          return true;
        }
      } catch { /* ignore */ }

      setStatus('Open the app', 'Start the Google sign in from the app again. / ابدأ تسجيل الدخول من التطبيق من جديد.');
      return true;
    }

    // PKCE-only OAuth callback (Supabase JS v2 uses PKCE exclusively).
    // No implicit flow fallback — it caused double-handling and race conditions.
    async function handleCallback() {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const error = params.get('error');
      const errorDescription = params.get('error_description');

      if (await handOffToAppIfRequested()) return;

      if (!supabase) {
        setStatus('Login failed', 'Supabase is not configured in this build.');
        return;
      }

      if (error) {
        const msg = errorDescription || error;
        setStatus('Login failed', 'Please try again. (' + msg + ')');
        console.error('OAuth callback error:', error, errorDescription);
        return;
      }

      try {
        setStatus('Signing you in', 'Verifying session');

        let user = null;

        // First, try to get existing session (auto-exchanged by supabase-js on load)
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();

        if (sessionError) {
          console.error('getSession error:', sessionError);
          throw sessionError;
        }

        if (session?.user) {
          user = session.user;
        } else if (hashTokens().access_token && hashTokens().refresh_token) {
          // Session forwarded from the browser (no PKCE verifier needed).
          setStatus('Signing you in', 'Adopting session');
          const { data, error: setErr } = await supabase.auth.setSession({
            access_token: hashTokens().access_token,
            refresh_token: hashTokens().refresh_token,
          });
          if (setErr) throw setErr;
          if (data?.user) user = data.user;
        } else if (code) {
          // Explicit code exchange if auto-exchange didn't complete
          setStatus('Signing you in', 'Exchanging code');
          const { data, error: exchangeError } = await supabase.auth.exchangeCodeForSession(code);
          if (exchangeError) {
            console.error('OAuth exchange failed:', exchangeError);
            throw exchangeError;
          }
          if (data?.user) {
            user = data.user;
          }
        }

        if (!user) {
          throw new Error('No session after OAuth redirect');
        }

        await completeWithUser(user);
      } catch (err) {
        console.error('Callback login failed:', err);
        const detail = (err && (err.message || err.code)) ? String(err.message || err.code) : 'unknown';

        // APK intermediate case: this page ran in the system browser, where the
        // PKCE verifier does not exist (it lives in the app's WebView). Deep-link
        // back to the app with the code so the app can complete the exchange.
        if (!isNativePlatform()) {
          if (code || hashTokens().access_token) {
            openInstalledApp(location.search + location.hash);
            return;
          }
        }

        setStatus('Login failed', 'Could not complete sign in. (' + detail + ') Please try again.');
        // Offer a manual way back to login instead of trapping the user.
        try {
          const btn = document.createElement('button');
          btn.textContent = 'Back to login / العودة لتسجيل الدخول';
          btn.style.cssText = 'margin-top:16px;padding:10px 16px;border-radius:8px;border:1px solid #CCFF00;background:#111;color:#CCFF00;cursor:pointer;font-size:13px;';
          btn.onclick = () => { window.location.replace(resolveReturnUrl().replace(/[^/]*$/, 'login.html')); };
          document.querySelector('.w-full.max-w-md').appendChild(btn);
        } catch {}
        // Don't redirect on error — let user retry
      }
    }

    async function completeWithUser(user) {
      if (done) return;
      done = true;

      const meta = user.user_metadata || {};

      // Ensure trial metadata exists for new users
      if (!meta.subscription) {
        try {
          await supabase.auth.updateUser({
            data: {
              subscription: 'trial',
              subStart: NOW,
              subEnd: NOW + 30 * 86400000,
              subTier: 'free_trial',
            },
          });
        } catch (err) {
          console.warn('metadata update failed:', err);
        }
      }

      // Persist user data for app access — via the single session writer
      // (INV5), same normalised shape as every other login path.
      writeSession({
        id: user.id,
        email: user.email,
        name: meta.name || meta.full_name || (user.email && user.email.split('@')[0]) || 'User',
        status: 'active',
        subscription: meta.subscription || 'trial',
        subStart: meta.subStart || NOW,
        subEnd: meta.subEnd || NOW + 30 * 86400000,
        subTier: meta.subTier || 'free_trial',
      });

      // Ensure Supabase session is persisted in localStorage (it should be automatic, but verify)
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          console.log('[callback] Supabase session confirmed');
        }
      } catch {}

      setStatus('Signing you in', 'Redirecting to your dashboard.');

      // Same allowlisted target as persistLogin() above.
      window.location.replace(resolveReturnUrl());
    }

    handleCallback();
  </script>
</body>
</html>
