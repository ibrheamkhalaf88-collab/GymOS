<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Pulse — Authentication</title>
  <meta name="theme-color" content="#000000" />
  <script src="../vendor/tailwind.js"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <style>
    body { min-height: max(884px, 100dvh); background-color: #000; }
    .cyber-grid {
      background-image:
        linear-gradient(to right, rgba(68, 73, 51, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(68, 73, 51, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="font-body min-h-screen flex flex-col antialiased cyber-grid items-center justify-center" style="color: #e2e4cf;">

  <div class="w-full max-w-md p-8 text-center">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full border border-[#8e9379] flex items-center justify-center" style="background-color:#333627;">
      <svg class="h-8 w-8 text-[#CCFF00]" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>
    <h2 class="font-headline text-xl uppercase tracking-widest mb-2" id="cbStatus">Signing you in…</h2>
    <p class="text-sm text-muted mb-6" id="cbSub">Redirecting to your dashboard.</p>
    <div class="flex justify-center">
      <div class="w-10 h-10 border-4 border-[#CCFF00] border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- Handle the OAuth callback — runs immediately -->
  <script src="../vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase-client.js';
    import { APP_BASE } from '../js/config.js';

    const statusEl = document.getElementById('cbStatus');
    const subEl = document.getElementById('cbSub');
    const setStatus = (t, s) => {
      if (t) statusEl.textContent = t;
      if (s) subEl.textContent = s;
    };

    const REF = 'mwfbgucayjgbbvcyelbo';
    const SB_KEY = 'sb-' + REF + '-auth-token';
    const NOW = Date.now();
    let done = false;

    function persistLogin(user) {
      if (done) return;
      done = true;
      const meta = user.user_metadata || {};
      localStorage.setItem('dp_current_user', JSON.stringify({
        id: user.id,
        email: user.email,
        name: meta.name || meta.full_name || (user.email && user.email.split('@')[0]) || 'User',
        status: 'active',
        subscription: meta.subscription || 'trial',
        subStart: meta.subStart || NOW,
        subEnd: meta.subEnd || NOW + 30 * 86400000,
        subTier: meta.subTier || 'free_trial',
        loginAt: NOW,
      }));
      localStorage.setItem('dp_user_email', user.email || '');
      
      // Redirect to return URL or app.html — resolve correctly from site root
      const returnUrl = new URLSearchParams(window.location.search).get('return') || 'app.html';
      // Use absolute path from origin to avoid resolving relative to /auth/
      const redirectUrl = new URL(returnUrl.startsWith('/') ? returnUrl : '/' + returnUrl, window.location.origin).href;
      window.location.replace(redirectUrl);
    }

    // Failsafe watchdog — if main flow doesn't complete in 10s, try to recover from hash (legacy implicit flow)
    setTimeout(() => {
      if (done) return;
      // Only attempt hash recovery for legacy implicit flow (not PKCE)
      const hash = new URLSearchParams(location.hash.replace(/^#/, '?'));
      const at = hash.get('access_token') || hash.get('token');
      if (!at) {
        setStatus('Login not completed', 'No session found. Please return and try again.');
        return;
      }
      try {
        // Decode JWT to get user info
        const body = at.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(decodeURIComponent(escape(atob(body))));
        // Store session for library compatibility
        const session = {
          access_token: at,
          token_type: 'bearer',
          expires_in: Number(hash.get('expires_in')) || 3600,
          expires_at: NOW + (Number(hash.get('expires_in')) || 3600) * 1000,
          refresh_token: hash.get('refresh_token') || '',
          user: {
            id: payload.sub || '',
            aud: 'authenticated',
            role: 'authenticated',
            email: payload.email || '',
            email_confirmed_at: NOW,
            user_metadata: { name: hash.get('name') || '' },
            app_metadata: { provider: 'google' },
          },
        };
        localStorage.setItem(SB_KEY, JSON.stringify(session));
        persistLogin({
          id: payload.sub || '',
          email: payload.email || '',
          user_metadata: { name: hash.get('name') || '' },
        });
      } catch (err) {
        console.error('failsafe login failed:', err);
        setStatus('Login not completed', 'Could not read the session. Close and try again.');
      }
    }, 10000);

    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (!supabase) {
      setStatus('Login failed', 'Supabase is not configured in this build.');
      return;
    }

    if (error) {
      setStatus('Login failed', 'Please try again. (' + error + ')');
      console.error('OAuth callback error param:', error);
      return;
    }

    // Main flow: Supabase automatically handles PKCE code exchange on page load.
    // Just wait for the session to be established, then persist user data and redirect.
    async function completeLogin() {
      try {
        setStatus('Signing you in…', 'Verifying session…');
        
        // Give Supabase a moment to auto-exchange the code (it does this on page load)
        await new Promise(r => setTimeout(r, 100));
        
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        
        if (sessionError) {
          console.error('getSession error:', sessionError);
          throw sessionError;
        }
        
        if (!session?.user) {
          // If no session yet, try explicit exchange (for cases where auto-exchange didn't run)
          if (code) {
            setStatus('Signing you in…', 'Exchanging code…');
            const { data, error: exchangeError } = await supabase.auth.exchangeCodeForSession(code);
            if (exchangeError) {
              console.error('OAuth exchange failed:', exchangeError);
              throw exchangeError;
            }
            if (data?.user) {
              await completeWithUser(data.user);
              return;
            }
          }
          throw new Error('No session after OAuth redirect');
        }
        
        await completeWithUser(session.user);
      } catch (err) {
        console.error('Callback login failed:', err);
        setStatus('Login failed', 'Could not complete sign in. Please try again.');
        // Don't redirect on error — let user retry
      }
    }

    async function completeWithUser(user) {
      if (done) return;
      done = true;
      
      const meta = user.user_metadata || {};
      
      // Ensure trial metadata exists for new users
      if (!meta.subscription) {
        try {
          await supabase.auth.updateUser({
            data: {
              subscription: 'trial',
              subStart: NOW,
              subEnd: NOW + 30 * 86400000,
              subTier: 'free_trial',
            },
          });
        } catch (err) {
          console.warn('metadata update failed:', err);
        }
      }
      
      // Persist user data for app access
      localStorage.setItem('dp_current_user', JSON.stringify({
        id: user.id,
        email: user.email,
        name: meta.name || meta.full_name || (user.email && user.email.split('@')[0]) || 'User',
        status: 'active',
        subscription: meta.subscription || 'trial',
        subStart: meta.subStart || NOW,
        subEnd: meta.subEnd || NOW + 30 * 86400000,
        subTier: meta.subTier || 'free_trial',
        loginAt: NOW,
      }));
      localStorage.setItem('dp_user_email', user.email || '');
      
      // Ensure Supabase session is persisted in localStorage (it should be automatic, but verify)
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          // Session exists in Supabase client — it's already in localStorage with correct key
          console.log('[callback] Supabase session confirmed');
        }
      } catch {}
      
      setStatus('Signing you in…', 'Redirecting to your dashboard.');
      
      // Redirect using absolute URL from origin (avoid /auth/ resolution bug)
      const returnUrl = new URLSearchParams(window.location.search).get('return') || 'app.html';
      const redirectUrl = new URL(returnUrl.startsWith('/') ? returnUrl : '/' + returnUrl, window.location.origin).href;
      window.location.replace(redirectUrl);
    }

    // Start the login completion flow
    completeLogin();
  </script>
</body>
</html>
