<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Pulse — Authentication</title>
  <meta name="theme-color" content="#000000" />
  <script src="../vendor/tailwind.js"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <style>
    body { min-height: max(884px, 100dvh); background-color: #000; }
    .cyber-grid {
      background-image:
        linear-gradient(to right, rgba(68, 73, 51, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(68, 73, 51, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="font-body min-h-screen flex flex-col antialiased cyber-grid items-center justify-center" style="color: #e2e4cf;">
  <div id="offlineBanner" class="offline-banner hidden" role="status" aria-live="polite">
  Offline — لا يوجد اتصال · تعرض البيانات المحلية
</div>

  <div class="w-full max-w-md p-8 text-center">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full border border-[#8e9379] flex items-center justify-center" style="background-color:#333627;">
      <svg class="h-8 w-8 text-[#CCFF00]" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>
    <h2 class="font-headline text-xl uppercase tracking-widest mb-2" id="cbStatus">Signing you in…</h2>
    <p class="text-sm text-muted mb-6" id="cbSub">Redirecting to your dashboard.</p>
    <div class="flex justify-center">
      <div class="w-10 h-10 border-4 border-[#CCFF00] border-t-transparent rounded-full animate-spin"></div>
    </div>
    <p class="text-xs text-muted mt-4" id="cbDebug"></p>
  </div>

  <!-- Handle the OAuth callback — runs immediately -->
  <script src="../vendor/supabase-js.js"></script>
  <script type="module">
    const statusEl = document.getElementById('cbStatus');
    const subEl = document.getElementById('cbSub');
    const debugEl = document.getElementById('cbDebug');
    const setStatus = (t, s, d) => {
      if (t) statusEl.textContent = t;
      if (s) subEl.textContent = s;
      if (d) debugEl.textContent = d;
    };

    const REF = 'mwfbgucayjgbbvcyelbo';
    const SB_KEY = 'sb-' + REF + '-auth-token';
    const NOW = Date.now();
    let done = false;

    function logStep(msg) {
      console.log('[callback]', msg);
      setStatus(null, null, msg);
    }

    function persistLogin(user) {
      if (done) return;
      done = true;
      const meta = user.user_metadata || {};
      localStorage.setItem('dp_current_user', JSON.stringify({
        id: user.id,
        email: user.email,
        name: meta.name || meta.full_name || (user.email && user.email.split('@')[0]) || 'User',
        status: 'active',
        subscription: meta.subscription || 'trial',
        subStart: meta.subStart || NOW,
        subEnd: meta.subEnd || NOW + 30 * 86400000,
        subTier: meta.subTier || 'free_trial',
        loginAt: NOW,
      }));
      localStorage.setItem('dp_user_email', user.email || '');
      window.location.replace(new URL('../app.html', import.meta.url).href);
    }

    // Create Supabase client with detectSessionInUrl disabled to avoid auto-detect race
    const { appConfig } = await import('../js/config.js');
    const createClientFn = window.supabase?.createClient;
    let supabase = null;
    try {
      if (createClientFn && appConfig?.supabaseUrl && appConfig?.supabaseAnonKey) {
        supabase = createClientFn(appConfig.supabaseUrl, appConfig.supabaseAnonKey, {
          auth: {
            autoRefreshToken: true,
            persistSession: true,
            detectSessionInUrl: false,
            storage: window.localStorage,
            flowType: 'pkce',
          },
        });
      } else {
        const mod = await import('../js/supabase-client.js');
        supabase = mod.supabase;
      }
    } catch (err) {
      console.error('[callback] failed to init supabase:', err);
      setStatus('Login failed', 'Supabase init failed', 'فشل تهيئة المصادقة');
      return;
    }

    function decodeJwt(token) {
      try {
        const body = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(escape(atob(body))));
      } catch (err) {
        return {};
      }
    }

    function persistSessionIntoLibrary(accessToken, refreshToken, expiresIn) {
      try {
        const payload = decodeJwt(accessToken);
        const session = {
          access_token: accessToken,
          token_type: 'bearer',
          expires_in: Number(expiresIn) || 3600,
          expires_at: NOW + (Number(expiresIn) || 3600) * 1000,
          refresh_token: refreshToken || '',
          user: {
            id: payload.sub || '',
            aud: 'authenticated',
            role: 'authenticated',
            email: payload.email || '',
            email_confirmed_at: NOW,
            user_metadata: {},
            app_metadata: { provider: 'google' },
          },
        };
        localStorage.setItem(SB_KEY, JSON.stringify(session));
      } catch (err) {
        console.warn('persistSessionIntoLibrary failed:', err);
      }
    }

    function hashTokens() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, '?'));
      return {
        at: hash.get('access_token') || hash.get('token'),
        rt: hash.get('refresh_token'),
        expiresIn: hash.get('expires_in'),
        email: hash.get('email'),
        name: hash.get('name'),
      };
    }

    // Watchdog: show error on timeout, do NOT create synthetic session
    const watchdog = setTimeout(() => {
      if (done) return;
      setStatus('Login not completed', 'Sign-in timed out. Please try again.', 'انتهت مهلة تسجيل الدخول — جرّب مرة ثانية');
    }, 8000);

    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDesc = params.get('error_description');

    if (!supabase) {
      setStatus('Login failed', 'Supabase is not configured in this build.', 'Supabase غير مُعد');
      return;
    }

    if (error) {
      const safeMsg = (errorDesc || error || '').toString().replace(/[?&#].*$/, '').slice(0, 200);
      setStatus('Login failed', 'Please try again. (' + safeMsg + ')', 'خطأ: ' + safeMsg);
      console.error('OAuth callback error param:', error, errorDesc);
      return;
    }

    let user = null;
    let exchangeAttempted = false;

    // Step 1: Check existing session first
    logStep('Checking existing session… / جارٍ التحقق من الجلسة الحالية…');
    try {
      const { data: { session: s } } = await supabase.auth.getSession();
      if (s?.user) {
        user = s.user;
        logStep('Session found / تم العثور على جلسة');
      } else {
        logStep('No active session / لا توجد جلسة نشطة');
      }
    } catch (err) {
      logStep('getSession failed: ' + err.message, 'فشل فحص الجلسة: ' + err.message);
      console.warn('getSession failed:', err);
    }

    // Step 2: Exchange code ONCE if no session
    if (!user && code && !exchangeAttempted) {
      exchangeAttempted = true;
      logStep('Exchanging code for session… / جارٍ تبادل الكود…');
      try {
        const { data, error: e1 } = await supabase.auth.exchangeCodeForSession(code);
        if (!e1 && data?.user) {
          user = data.user;
          logStep('Code exchange succeeded / تم تبادل الكود بنجاح');
        } else if (e1) {
          logStep('Code exchange failed: ' + e1.message, 'فشل تبادل الكود: ' + e1.message);
          console.error('OAuth exchange failed:', e1);
        }
      } catch (err) {
        logStep('Code exchange threw: ' + err.message, 'خطأ في التبادل: ' + err.message);
        console.warn('exchangeCodeForSession threw:', err);
      }
    } else if (!user && !code) {
      logStep('No code in URL / لا يوجد كود في الرابط');
    }

    // Final result
    if (!user) {
      clearTimeout(watchdog);
      logStep('Login failed. Please try again.', 'فشل تسجيل الدخول — جرّب مرة ثانية');
      setStatus('Login not completed', 'Could not complete sign in. Please try again.', 'فشل تسجيل الدخول — جرّب مرة ثانية');
      return;
    }

    clearTimeout(watchdog);
    logStep('Login successful! Redirecting… / تم الدخول بنجاح! جارٍ التوجيه…');
    setStatus('Signing you in…', 'Redirecting to your dashboard.', 'جارٍ التوجيه للوحة التحكم…');
    persistLogin(user);
  </script>
  <script>
  (function(){
    function setOffline(on){
      var b=document.getElementById('offlineBanner');
      if(b) b.classList.toggle('hidden', !on);
    }
    window.addEventListener('online', ()=>setOffline(false));
    window.addEventListener('offline', ()=>setOffline(true));
    setOffline(!navigator.onLine);
  })();
  </script>
</body>
</html>
