<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Pulse — Authentication</title>
  <meta name="theme-color" content="#000000" />
  <script src="vendor/tailwind.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body { min-height: max(884px, 100dvh); background-color: #000; }
    .cyber-grid {
      background-image:
        linear-gradient(to right, rgba(68, 73, 51, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(68, 73, 51, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="font-body min-h-screen flex flex-col antialiased cyber-grid items-center justify-center" style="color: #e2e4cf;">

  <div class="w-full max-w-md p-8 text-center">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full border border-[#8e9379] flex items-center justify-center" style="background-color:#333627;">
      <svg class="h-8 w-8 text-[#CCFF00]" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>
    <h2 class="font-headline text-xl uppercase tracking-widest mb-2">Signing you in…</h2>
    <p class="text-sm text-muted mb-6">Redirecting to your dashboard.</p>
    <div class="flex justify-center">
      <div class="w-10 h-10 border-4 border-[#CCFF00] border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- Handle the OAuth callback — runs immediately -->
  <script src="../vendor/supabase-js.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase-client.js';

    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (!supabase) {
      window.location.href = 'login.html';
      return;
    }

    if (error) {
      document.querySelector('h2').textContent = 'Login failed';
      document.querySelector('p').textContent = 'Please try again.';
      return;
    }

    if (code) {
      const { data, error: sessionError } = await supabase.auth.exchangeCodeForSession(code);
      if (sessionError) {
        console.error('OAuth exchange failed:', sessionError);
        document.querySelector('h2').textContent = 'Session error';
        document.querySelector('p').textContent = 'Try logging in again.';
        return;
      }

      const user = data?.user;
      if (user) {
        const meta = user.user_metadata || {};
        const now = Date.now();

        // First Google login → persist 30-day trial in user_metadata
        if (!meta.subscription) {
          await supabase.auth.updateUser({
            data: {
              subscription: 'trial',
              subStart: now,
              subEnd: now + 30 * 86400000,
              subTier: 'free_trial',
            },
          });
        }

        const session = {
          id: user.id,
          email: user.email,
          name: meta.name || user.email?.split('@')[0] || 'User',
          status: 'active',
          subscription: meta.subscription || 'trial',
          subStart: meta.subStart || now,
          subEnd: meta.subEnd || now + 30 * 86400000,
          subTier: meta.subTier || 'free_trial',
          loginAt: now,
        };
        localStorage.setItem('dp_current_user', JSON.stringify(session));
        localStorage.setItem('dp_user_email', session.email);
      }
      window.location.href = 'app.html';
      return;
    }

    const { data: { session: sbSession } } = await supabase.auth.getSession();
    if (sbSession?.user) {
      const u = sbSession.user;
      const meta = u.user_metadata || {};
      const now = Date.now();
      if (!meta.subscription) {
        await supabase.auth.updateUser({
          data: {
            subscription: 'trial',
            subStart: now,
            subEnd: now + 30 * 86400000,
            subTier: 'free_trial',
          },
        });
      }
      localStorage.setItem('dp_current_user', JSON.stringify({
        id: u.id,
        email: u.email,
        name: meta.name || u.email?.split('@')[0] || 'User',
        status: 'active',
        subscription: meta.subscription || 'trial',
        subStart: meta.subStart || now,
        subEnd: meta.subEnd || now + 30 * 86400000,
        subTier: meta.subTier || 'free_trial',
        loginAt: now,
      }));
      localStorage.setItem('dp_user_email', u.email);
      window.location.href = 'app.html';
    } else {
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
